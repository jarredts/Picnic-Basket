<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Hearth 95 — Family Meal Planner</title>
<meta name="theme-color" content="#000080">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bungee&display=swap" rel="stylesheet">
<style>
/* ================= THEME DEFINITIONS ================= */
:root {
  /* Mode 1: Win95 Retro Computer (Clean Gray & Titlebar Blue) */
  --win-bg:#C0C0C0;
  --win-blue:#000080;
  --win-blue-lt:#1084D0;
  --win-border-light:#FFFFFF;
  --win-border-dark:#808080;
  --win-border-darkest:#000000;
  --card-bg:#FFFFFF;
  --card-text:#000000;
  --accent-btn:#C0C0C0;
  --primary-action:#000080;
  --primary-text:#FFFFFF;
  --danger-action:#AA0000;
  --btn-action-bg:#000080;
  --btn-action-text:#FFFFFF;
  --tag-bg:#E0E0E0;
  --tag-text:#000000;
  --highlight:#FFFFCC;
  --font-disp:'Press Start 2P', monospace;
  --font-body:'Space Mono', monospace;
  --font-vt:'VT323', monospace;
  --pattern: linear-gradient(45deg, #808080 25%, transparent 25%), linear-gradient(-45deg, #808080 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #808080 75%), linear-gradient(-45deg, transparent 75%, #808080 75%);
  --pattern-size: 4px 4px;
}

[data-theme="cyber"] {
  /* Mode 2: 90s Arcade Neon (Hot Pink, Electric Cyan & Acid Green) */
  --win-bg:#00FFFF;
  --win-blue:#9D00FF;
  --win-blue-lt:#FF007F;
  --win-border-light:#FFFF00;
  --win-border-dark:#0A0A0A;
  --win-border-darkest:#0A0A0A;
  --card-bg:#FFFF00;
  --card-text:#0A0A0A;
  --accent-btn:#39FF14;
  --primary-action:#FF007F;
  --primary-text:#FFFF00;
  --danger-action:#FF0000;
  --btn-action-bg:#9D00FF;
  --btn-action-text:#FFFF00;
  --tag-bg:#00FFFF;
  --tag-text:#0A0A0A;
  --highlight:#FF99CC;
  --font-disp:'Bungee', cursive;
  --pattern: radial-gradient(#9D00FF 15%, transparent 16%), radial-gradient(#FF007F 15%, transparent 16%);
  --pattern-size: 30px 30px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--win-bg);
  color: var(--card-text);
  font-family: var(--font-body);
  overscroll-behavior-y:none;
  background-image: var(--pattern);
  background-size: var(--pattern-size);
}
button{font-family:inherit;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background: var(--win-bg);
  position:relative;
  border-left: 3px solid var(--win-border-darkest);
  border-right: 3px solid var(--win-border-darkest);
}

/* ---------- Titlebar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background: linear-gradient(90deg, var(--win-blue), var(--win-blue-lt));
  color: #FFF;
  padding: 6px 8px;
  border-bottom: 3px solid var(--win-border-darkest);
  box-shadow: inset 1px 1px 0px var(--win-border-light), inset -1px -1px 0px var(--win-border-dark);
}
.topbar-header{
  display:flex; justify-content:space-between; align-items:center;
}
.topbar h1{
  font-family: var(--font-disp);
  font-size: 11px;
  margin: 0;
  letter-spacing: 1px;
  text-shadow: 2px 2px 0px #000;
}
.header-right{
  display:flex; gap:4px; align-items:center;
}
.version-tag{
  font-family: var(--font-vt);
  font-size: 15px;
  color: #FFFF00;
  background: #000;
  padding: 1px 4px;
  border: 1px solid var(--win-border-light);
}

.theme-toggle-btn{
  font-family: var(--font-vt);
  font-size: 16px;
  font-weight: bold;
  background: #C0C0C0;
  color: #000;
  border: 2px solid;
  border-color: var(--win-border-light) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-light);
  padding: 2px 8px;
  cursor: pointer;
  box-shadow: 1px 1px 0px #000;
}
.theme-toggle-btn:active{
  border-color: var(--win-border-darkest) var(--win-border-light) var(--win-border-light) var(--win-border-darkest);
  transform: translate(1px, 1px);
  box-shadow: none;
}
[data-theme="cyber"] .theme-toggle-btn {
  background: #FF007F;
  color: #FFFF00;
  border-color: #FFFF00 #0A0A0A #0A0A0A #FFFF00;
  text-shadow: 1px 1px 0px #000;
}

.topbar .sub{
  font-size: 10px;
  color: #00FFFF;
  font-family: var(--font-vt);
  letter-spacing: 1px;
  margin-top: 2px;
}
.topbar-controls{
  margin-top: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--win-bg);
  padding: 4px;
  border: 2px solid;
  border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
}

/* ---------- Main Views ---------- */
#view{
  flex:1;
  padding:12px 12px 88px;
  overflow-y:auto;
}
h2.section-title{
  font-family: var(--font-disp);
  font-size: 10px;
  margin: 0 0 8px;
  color: var(--win-blue);
  text-shadow: 1px 1px 0px #FFF;
}
.card{
  background: var(--card-bg);
  color: var(--card-text);
  border: 3px solid;
  border-color: var(--win-border-dark) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-dark);
  box-shadow: 2px 2px 0px #000;
  padding: 12px;
  margin-bottom: 12px;
  position: relative;
}
.pill{
  display:inline-flex; align-items:center; gap:4px;
  padding: 4px 10px; background: var(--accent-btn); color: var(--card-text);
  font-size: 11px; font-weight: 700; cursor: pointer;
  border: 2px solid;
  border-color: var(--win-border-light) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-light);
}
.pill.active{
  background: var(--primary-action);
  color: var(--primary-text);
}
.chip{
  display:inline-flex; align-items:center; gap:4px;
  padding: 4px 8px; background: var(--accent-btn); color: var(--card-text);
  font-size: 11px; font-weight: 700; cursor: pointer;
  border: 2px solid;
  border-color: var(--win-border-light) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-light);
}
.chip.active{
  background: var(--primary-action);
  color: var(--primary-text);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background: var(--accent-btn); color: var(--card-text);
  border: 2px solid;
  border-color: var(--win-border-light) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-light);
  padding: 8px 12px; font-weight: 700; font-size: 11px; cursor: pointer;
  font-family: var(--font-body);
  box-shadow: 1px 1px 0px #000;
}
.btn:active{
  border-color: var(--win-border-darkest) var(--win-border-light) var(--win-border-light) var(--win-border-darkest);
  transform: translate(1px, 1px); box-shadow: none;
}
.btn-primary{background: var(--primary-action); color: var(--primary-text);}
.btn-teal{background: var(--btn-action-bg); color: var(--btn-action-text);}
.btn-gold{background: #D99B26; color: #000;}
.btn-ghost{background: #E0E0E0; color: #000;}
.btn-danger{background: var(--danger-action); color: #FFF;}
.btn-block{width:100%;}
.btn-sm{padding: 4px 8px; font-size: 10.5px;}

input[type=text],input[type=number],input[type=url],input[type=date],select,textarea{
  width:100%; padding: 6px 8px;
  border: 2px solid;
  border-color: var(--win-border-darkest) var(--win-border-light) var(--win-border-light) var(--win-border-darkest);
  background: #FFF; color: #000; font-family: var(--font-body); font-size: 12px;
}
label.field-label{
  display:block; font-size: 10px; font-weight:700; text-transform:uppercase;
  color: var(--win-blue); margin: 8px 0 3px; font-family: var(--font-disp);
}

/* ---------- Win95 Window Titlebar Simulation for Cards ---------- */
.win-titlebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, var(--win-blue), var(--win-blue-lt));
  color: #FFF;
  padding: 4px 6px;
  margin: -12px -12px 10px -12px;
  font-family: var(--font-disp);
  font-size: 9px;
}
.win-titlebar-controls {
  display: flex;
  gap: 3px;
}
.win-btn {
  width: 20px;
  height: 20px;
  background: #C0C0C0;
  color: #000;
  border: 2px solid;
  border-color: #FFF #000 #000 #FFF;
  font-size: 13px;
  font-weight: bold;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  line-height: 1;
  padding: 0;
}
.win-btn:active {
  border-color: #000 #FFF #FFF #000;
  transform: translate(1px, 1px);
}
[data-theme="cyber"] .win-btn {
  background: #FF007F;
  color: #FFFF00;
  border: 2px solid #000;
  font-size: 14px;
}

/* ---------- Taskbar ---------- */
.tabbar{
  position:sticky; bottom:0; z-index:20;
  display:flex; background: var(--win-bg);
  border-top: 3px solid var(--win-border-light);
  padding: 4px;
}
.tabbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  background: var(--accent-btn);
  border: 2px solid;
  border-color: var(--win-border-light) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-light);
  color: var(--card-text); padding: 4px 2px; cursor: pointer;
}
.tabbtn svg{width:16px;height:16px;}
.tabbtn span{font-size:9px; font-weight:700;}
.tabbtn.active{
  background: #E0E0E0;
  border-color: var(--win-border-darkest) var(--win-border-light) var(--win-border-light) var(--win-border-darkest);
  box-shadow: inset 1px 1px 0px var(--win-border-dark);
  color: var(--win-blue);
}

/* ---------- Calendar & Planner UI ---------- */
.cal-grid-month{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-dow{font-family:var(--font-vt); font-size:14px; color: var(--win-blue); text-align:center; padding-bottom:2px; font-weight:bold;}
.cal-day-month{
  background: #FFF; border: 2px solid;
  border-color: var(--win-border-dark) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-dark);
  min-height:50px; padding:3px; cursor:pointer; position:relative;
}
.cal-day-month.today{border-color: var(--win-blue); border-width: 2px;}
.cal-day-month.selected{background: var(--highlight);}
.cal-day-month.other-month{opacity:.35;}
.cal-daynum{font-family:var(--font-vt); font-size:14px; font-weight:bold; color:#000;}
.badge-row{display:flex; flex-wrap:wrap; gap:1px; margin-top:2px;}
.type-badge{
  width:12px; height:12px; border:1px solid #000; color:#000; font-size:7px; font-weight:bold;
  display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-vt);
}
.cal-week-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x mandatory;}
.cal-week-day{
  flex:0 0 84%; scroll-snap-align:start; background: var(--card-bg); color: var(--card-text); border: 2px solid;
  border-color: var(--win-border-dark) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-dark);
  padding:8px; min-height:160px; box-shadow: 2px 2px 0px #000;
}
.cal-week-day.today{border-color: var(--win-blue); border-width: 3px;}
.cal-week-day h3{font-family:var(--font-disp); font-size:9px; margin:0 0 6px; color: var(--win-blue);}
.week-meal-row{
  display:flex; justify-content:space-between; align-items:center; gap:6px;
  padding:4px 6px; background:#FFFFEE; color:#000; border: 1px solid var(--win-border-darkest);
  border-left-width: 5px; border-left-style: solid;
  margin-bottom:4px; font-size:11px; cursor:pointer; font-weight:700;
}
.week-meal-row .mname{flex:1;}
.week-meal-row .cost{font-family:var(--font-vt); font-size:14px; color:var(--win-blue);}

.day-detail{margin-top:12px;}
.ing-row{display:flex; align-items:center; gap:6px; padding:4px 0; border-bottom:1px dotted var(--win-border-dark); font-size:11.5px; font-weight:700;}
.ing-row.checked{opacity:.4; text-decoration:line-through;}
.ing-row input[type=checkbox]{width:16px; height:16px; accent-color: var(--win-blue); border:2px solid #000;}
.ing-qty{font-family:var(--font-vt); font-size:14px; color:var(--win-blue); margin-left:auto;}

/* ---------- Receipt / Grocery List ---------- */
.receipt{
  background:#FFFFF0; color: #000;
  border: 3px solid; border-color: var(--win-border-darkest) var(--win-border-light) var(--win-border-light) var(--win-border-darkest);
  padding:14px 12px 8px; font-family:var(--font-vt); font-size: 18px; box-shadow: 2px 2px 0px #000;
  position:relative;
}
.receipt-head{text-align:center; margin-bottom:8px;}
.receipt-head .store{font-family:var(--font-disp); font-size:10px; color: var(--win-blue); letter-spacing: 1px;}
.receipt-head .meta{font-size:13px; color:#333;}
.receipt hr{border:none; border-top:2px dashed var(--win-border-darkest); margin:6px 0;}
.receipt-line{display:flex; align-items:center; gap:6px; padding:3px 0;}
.receipt-line .name{flex:1; font-weight:bold;}
.receipt-line.purchased .name{text-decoration:line-through; opacity:.4;}
.receipt-line .qty{white-space:nowrap;}
.receipt-line .est{white-space:nowrap; color: var(--win-blue); font-weight:bold;}
.step-btn{
  width:18px; height:18px; border: 1px solid #000; background:#C0C0C0;
  font-weight:bold; cursor:pointer; font-family:var(--font-vt); line-height:1;
}
.receipt-total{display:flex; justify-content:space-between; font-weight:bold; font-size:17px; padding-top:6px;}

.empty{
  text-align:center; padding:24px 12px; color:var(--win-blue); font-family:var(--font-vt); font-size:18px;
}
.tag{
  display:inline-block; font-family:var(--font-vt); font-size:13px; padding:1px 5px;
  border:1px solid #000; background: var(--tag-bg); color: var(--tag-text); margin-right:3px; font-weight:bold;
}
.match-bar-track{background:#FFF; border:2px solid var(--win-border-darkest); height:8px; overflow:hidden; margin-top:4px;}
.match-bar-fill{height:100%; background: #2E6F40;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:12px;
}
.modal{
  background: var(--win-bg); color: #000; width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
  border: 3px solid; border-color: var(--win-border-light) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-light);
  padding: 14px; box-shadow: 4px 4px 0px #000;
}
.modal h2{font-family: var(--font-disp); font-size: 10px; margin: 0 0 10px; color: var(--win-blue);}
.ing-edit-row{margin-bottom:6px;}
.ing-edit-subrow{display:flex; gap:4px; margin-top:3px; align-items:center;}
.ing-edit-subrow input[type=number]{width:48px; flex:0 0 48px; padding:6px 4px;}
.ing-edit-subrow select{flex:0 0 58px; padding:6px 2px;}
.ing-edit-subrow .cost-input{flex:0 0 54px;}
.iconbtn{background:#C0C0C0; border: 2px solid; border-color: var(--win-border-light) var(--win-border-darkest) var(--win-border-darkest) var(--win-border-light); cursor:pointer; font-size:14px; padding:2px 6px;}

#toast{
  position:fixed; left:50%; bottom:72px; transform:translate(-50%,12px);
  background: var(--win-blue); color: #FFFF00; border:2px solid #FFF; padding:8px 14px;
  font-family: var(--font-vt); font-size: 18px; opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  z-index:60; max-width:85%; text-align:center; box-shadow: 2px 2px 0px #000;
}
#toast.show{opacity:1; transform:translate(-50%,0);}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body data-theme="retro">
<div id="app">
  <header class="topbar">
    <div class="topbar-header">
      <h1 id="topTitle">HEARTH 95</h1>
      <div class="header-right">
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle 90s Theme">🖥️ Win95</button>
        <span class="version-tag">v9.4.7.8</span>
      </div>
    </div>
    <div class="sub" id="topSub">90s RETRO MENU BUILDER</div>
    <div class="topbar-controls" id="topControls"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============================= SERVICE WORKER ============================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
  });
}

/* ============================= STATE ============================= */
const STORE_KEY = 'hearth_v9_rule_engine';
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

const UNITS = {

  ]};

    {id:uid(), name:'eggs', qty:8, unit:'ea', cost:2.00}, {id:uid(), name:'bread', qty:4, unit:'ea', cost:0.80}
  ]};
  const b3 = { id:uid(), type:'breakfast', name:'Classic Pancakes', servings:4, costTotal:2.20, instructionsUrl:'https://www.allrecipes.com/recipe/21014/good-old-fashioned-pancakes/', ingredients:[
    {id:uid(), name:'flour', qty:2, unit:'cup', cost:0.80}, {id:uid(), name:'milk', qty:1, unit:'cup', cost:0.50}, {id:uid(), name:'eggs', qty:2, unit:'ea', cost:0.50}, {id:uid(), name:'sugar', qty:2, unit:'tbsp', cost:0.40}

  const b4 = { id:uid(), type:'breakfast', name:'Cinnamon French Toast', servings:4, costTotal:3.10, instructionsUrl:'https://www.allrecipes.com/recipe/7018/french-toast-i/', ingredients:[

  ]};
  const b5 = { id:uid(), type:'breakfast', name:'Banana Oatmeal Porridge', servings:4, costTotal:2.00, instructionsUrl:'https://www.budgetbytes.com/cinnamon-apple-oatmeal/', ingredients:[
    {id:uid(), name:'rolled oats', qty:2, unit:'cup', cost:1.20}, {id:uid(), name:'bananas', qty:2, unit:'ea', cost:0.60}, {id:uid(), name:'milk', qty:1, unit:'cup', cost:0.20}
  ]};
  const b6 = { id:uid(), type:'breakfast', name:'Breakfast Egg & Cheese Burritos', servings:4, costTotal:4.50, instructionsUrl:'https://www.budgetbytes.com/freezer-breakfast-burritos/', ingredients:[
    {id:uid(), name:'eggs', qty:6, unit:'ea', cost:1.50}, {id:uid(), name:'tortillas', qty:4, unit:'ea', cost:1.00}, {id:uid(), name:'cheddar cheese', qty:4, unit:'oz', cost:1.50}, {id:uid(), name:'salsa', qty:0.5, unit:'cup', cost:0.50}
  ]};
  const b7 = { id:uid(), type:'breakfast', name:'Cheesy Scrambled Egg Toast', servings:2, costTotal:2.10, instructionsUrl:'https://www.allrecipes.com/recipe/23971/fluffy-scrambled-eggs/', ingredients:[

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    const def = defaultState();
    if(!raw) return def;
    const parsed = JSON.parse(raw);
    const merged = {...def, ...parsed};
    if(!merged.meals || merged.meals.length < 10){
      merged.meals = def.meals;
    }
    merged.householdSize = merged.householdSize || 5;
    merged.menuSearchQuery = merged.menuSearchQuery || '';
    merged.menuFilterType = merged.menuFilterType || 'all';
    merged.entryStops = merged.entryStops || [];

    merged.entries = (merged.entries||[]).map(e=>({mealType:'dinner', servings:merged.householdSize, checked:[], recurring:false, daysOfWeek:[], ...e}));
    merged.shoppingList = (merged.shoppingList||[]).map(i=>({costEstimate:0, purchased:false, ...i}));
    return merged;
  }catch(e){ return defaultState(); }
}

/* ============================= SCALING & RULE ENGINE ============================= */
function getEntryServings(entry){
  return entry.servings !== undefined ? entry.servings : state.householdSize;
}
function getScaledMealCostForEntry(meal, entry){
  const baseServings = meal.servings || 4;
  const costPerPerson = (meal.costTotal || 0) / baseServings;
  return costPerPerson * getEntryServings(entry);
}
function getScaledQtyForEntry(qty, meal, entry){
  const baseServings = meal.servings || 4;
  return qty * (getEntryServings(entry) / baseServings);
}
function getScaledIngredientCostForEntry(ingCost, meal, entry){
  const baseServings = meal.servings || 4;
  const costPerPerson = (ingCost || 0) / baseServings;
  return costPerPerson * getEntryServings(entry);
}
function getScaledMealCost(meal){
  const baseServings = meal.servings || 4;
  const costPerPerson = (meal.costTotal || 0) / baseServings;
  return costPerPerson * state.householdSize;
}

function checkRecurringEntries(){
  let updated = false;
  state.entryStops = state.entryStops || [];
  state.entries.forEach(entry => {
    if(entry.recurring && entry.daysOfWeek && entry.daysOfWeek.length > 0){
      for(let i=1; i<=28; i++){
        const checkDate = new Date();
        checkDate.setDate(checkDate.getDate() + i);
        const dow = checkDate.getDay();
        
        if(entry.daysOfWeek.includes(dow)){
          const checkIso = iso(checkDate);
          const isStopped = state.entryStops.some(s => s.mealId === entry.mealId && s.date === checkIso);
          if(isStopped) continue;

          const exists = state.entries.some(e => e.date === checkIso && e.mealId === entry.mealId && e.mealType === entry.mealType);
          if(!exists){
            state.entries.push({
              id: uid(),
              date: checkIso,
              mealId: entry.mealId,
              mealType: entry.mealType,
              servings: entry.servings,
              checked: [],
              recurring: true,
              daysOfWeek: [...entry.daysOfWeek]
            });
            updated = true;
          }
        }
      }
    }
  });
  if(updated) save();
}
checkRecurringEntries();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

function toBase(qty, unit){ return qty * UNITS[unit].toBase; }
function displayFromBase(cat, baseQty){
  if(cat==='count') return {qty: round4(baseQty), unit:'ea'};
  if(cat==='weight'){
    if(baseQty >= 16) return {qty: round4(baseQty/16), unit:'lb'};
    return {qty: round4(baseQty), unit:'oz'};
  }
  if(baseQty >= 192) return {qty: round4(baseQty/192), unit:'qt'};
  if(baseQty >= 48)  return {qty: round4(baseQty/48), unit:'cup'};
  if(baseQty >= 3)   return {qty: round4(baseQty/3), unit:'tbsp'};
  return {qty: round4(baseQty), unit:'tsp'};
}
function round4(n){
  const r = Math.round(n*4)/4;
  return r % 1 === 0 ? r : Math.round(r*100)/100;
}
function fmtQtyUnit(qty, unit){ return `${round4(qty)} ${unit}`; }

function addIngredientsToShoppingListForEntry(meal, entry){
  let added = 0;
  meal.ingredients.forEach(ing=>{
    if(entry.checked.includes(ing.id)) return;
    const scaledQty = getScaledQtyForEntry(ing.qty, meal, entry);
    const scaledCost = getScaledIngredientCostForEntry(ing.cost, meal, entry);
    const cat = UNITS[ing.unit].cat;
    const base = toBase(scaledQty, ing.unit);
    const key = ing.name.trim().toLowerCase();
    let item = state.shoppingList.find(i => i.key===key && i.category===cat);
    if(item){
      item.base += base;
      item.costEstimate = (item.costEstimate||0) + scaledCost;
    } else {
      state.shoppingList.push({id:uid(), key, name:ing.name.trim(), category:cat, base, purchased:false, costEstimate: scaledCost});
    }
    added++;
  });
  save();
  return added;
}

function pantryHas(name){
  const key = name.trim().toLowerCase();
  return state.pantry.find(p=>(p.key||p.name.toLowerCase())===key);
}
function mealMatchPct(meal){
  if(!meal.ingredients.length) return 0;
  const have = meal.ingredients.filter(ing=>pantryHas(ing.name)).length;
  return Math.round((have/meal.ingredients.length)*100);
}

/* ============================= DATE HELPERS ============================= */
function startOfWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate() - d.getDay());
  return d;
}
function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function iso(d){ return d.toISOString().slice(0,10); }
function niceDate(d){ return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }
function byType(a,b){ return TYPE_ORDER.indexOf(a.mealType)-TYPE_ORDER.indexOf(b.mealType); }

function openStopRecurringModal(entry, actionType = 'delete'){
  const isDel = actionType === 'delete';
  openModal(`
    <h2>${isDel ? 'Delete Recurring Meal' : 'Edit Recurring Meal'}</h2>
    <p style="font-size:12px; font-weight:700; margin-bottom:12px;">This meal is part of a recurring schedule. Would you like to affect only this instance or future occurrences?</p>
    <button class="btn btn-ghost btn-block" id="onlyThis" style="margin-bottom:8px; background:#FFFF00;">Only this instance</button>
    <button class="btn btn-danger btn-block" id="forward" style="margin-bottom:12px;">From this date forward</button>
    <button class="btn btn-primary btn-block" id="cancelStop">Cancel</button>
  `);
  document.getElementById('cancelStop').onclick = closeModal;
  document.getElementById('onlyThis').onclick = ()=>{
    if(isDel){
      state.entries = state.entries.filter(e=>e.id!==entry.id);
      showToast('Single instance removed');
    } else {
      closeModal();
      openPlanModal({mealId: entry.mealId, defaultDate: entry.date, existingEntry: entry});
      return;
    }
    save(); closeModal(); render();
  };
  document.getElementById('forward').onclick = ()=>{
    if(!state.entryStops) state.entryStops = [];
    state.entryStops.push({ mealId: entry.mealId, date: entry.date });
    
    if(isDel){
      const targetDateObj = new Date(entry.date+'T00:00:00');
      const dayOfWeek = targetDateObj.getDay();
      state.entries = state.entries.filter(e => {
        const eDateObj = new Date(e.date+'T00:00:00');
        const isSameMeal = e.mealId === entry.mealId;
        const isSameDayOfWeek = eDateObj.getDay() === dayOfWeek;
        const isFutureOrToday = eDateObj >= targetDateObj;
        if(isSameMeal && isSameDayOfWeek && isFutureOrToday) return false;
        return true;
      });
      showToast('Recurring series stopped from this date forward');
      save(); closeModal(); render();
    } else {
      closeModal();
      openPlanModal({mealId: entry.mealId, defaultDate: entry.date, existingEntry: entry});
    }
  };
}

/* ============================= ADVANCED MENU PLANNER BUILDER ============================= */
function openPlanModal({mealId=null, defaultDate=null, existingEntry=null}={}){
  if(state.meals.length===0){
    openModal(`<h2>No recipes yet</h2><p>Add a recipe in the Menu tab first.</p><button class="btn btn-primary btn-block" id="closeM">Got it</button>`);
    document.getElementById('closeM').onclick = closeModal;
    return;
  }
  const d0 = defaultDate || state.selectedDate;
  let selMeal = mealId || (existingEntry ? existingEntry.mealId : state.meals[0].id);
  let selType = existingEntry ? existingEntry.mealType : 'dinner';
  let mealServings = existingEntry ? existingEntry.servings : state.householdSize;
  let isRecurring = existingEntry ? existingEntry.recurring : false;
  let selectedDays = existingEntry && existingEntry.daysOfWeek ? [...existingEntry.daysOfWeek] : [new Date(d0+'T00:00:00').getDay()];

  const DOW_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function bodyHtml(){
    const fixedMealName = mealId ? (state.meals.find(m=>m.id===selMeal)||{}).name : null;
    return `
      <h2>Menu Planner Builder</h2>
      ${fixedMealName ? `<div class="card" style="padding:6px 10px; margin-bottom:6px;"><strong>${fixedMealName}</strong></div>` :
        `<label class="field-label">Select Recipe</label>
         <select id="planMealSelect">${state.meals.map(m=>`<option value="${m.id}" ${m.id===selMeal?'selected':''}>${m.name}</option>`).join('')}</select>`}
      
      <label class="field-label">Meal Type</label>
      <div id="typeToggle" style="display:flex; gap:4px; flex-wrap:wrap;">
        ${TYPE_ORDER.map(t=>`<button type="button" class="chip ${t===selType?'active':''}" data-type="${t}">${TYPE_LABELS[t]} ${TYPE_NAMES[t]}</button>`).join('')}
      </div>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <div style="flex:1;">
          <label class="field-label">Servings</label>
          <input type="number" id="planServingsInput" value="${mealServings}" min="1" max="100">
        </div>
      </div>

      <div style="margin:10px 0; background:#E0E0E0; padding:8px; border:2px solid #000; color:#000;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
          <input type="checkbox" id="planRecurringCb" ${isRecurring?'checked':''} style="width:16px;height:16px;">
          <label for="planRecurringCb" style="font-size:11px;font-weight:700;cursor:pointer;margin:0;">Enable Recurring Schedule (e.g. M-F or Tuesdays only)</label>
        </div>
        <div id="dowContainer" style="display:${isRecurring?'block':'none'}; margin-top:6px;">
          <label class="field-label" style="margin-bottom:4px;">Repeat on these days of the week:</label>
          <div style="display:flex; gap:3px;">
            ${DOW_NAMES.map((name, idx)=>`
              <button type="button" class="chip ${selectedDays.includes(idx)?'active':''}" data-dow="${idx}" style="flex:1; padding:4px 2px; text-align:center; font-size:10px;">${name}</button>
            `).join('')}
          </div>
        </div>
      </div>

      <label class="field-label">Start Date</label>
      <input type="date" id="singleDateInput" value="${d0}">

      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn btn-ghost btn-block" id="cancelPlan">Cancel</button>
        <button class="btn btn-primary btn-block" id="confirmPlan">${existingEntry ? 'Update Schedule' : 'Build & Add Schedule'}</button>
      </div>
    `;
  }

  function refresh(){
    document.querySelector('.modal').innerHTML = bodyHtml();
    wire();
  }

  function wire(){
    document.getElementById('cancelPlan').onclick = closeModal;
    const mealSel = document.getElementById('planMealSelect');
    if(mealSel) mealSel.onchange = ()=>{ selMeal = mealSel.value; };
    const servIn = document.getElementById('planServingsInput');
    if(servIn) servIn.onchange = ()=>{ mealServings = parseInt(servIn.value, 10) || state.householdSize; };
    
    const recCb = document.getElementById('planRecurringCb');
    if(recCb) recCb.onchange = ()=>{ 
      isRecurring = recCb.checked; 
      refresh();
    };

    document.querySelectorAll('[data-dow]').forEach(btn=>{
      btn.onclick = ()=>{
        const dayIdx = parseInt(btn.dataset.dow, 10);
        if(selectedDays.includes(dayIdx)){
          selectedDays = selectedDays.filter(d=>d!==dayIdx);
        } else {
          selectedDays.push(dayIdx);
        }
        refresh();
      };
    });

    document.querySelectorAll('#typeToggle .chip').forEach(b=>{
      b.onclick = ()=>{ selType = b.dataset.type; refresh(); };
    });

    document.getElementById('confirmPlan').onclick = ()=>{
      const targetDateStr = document.getElementById('singleDateInput').value || d0;
      
      if(existingEntry){
        state.entries = state.entries.filter(e=>e.id!==existingEntry.id);
      }

      if(isRecurring && selectedDays.length > 0){
        const baseDate = new Date(targetDateStr+'T00:00:00');
        let addedCount = 0;
        
        for(let i=0; i<28; i++){
          const d = new Date(baseDate);
          d.setDate(d.getDate() + i);
          const dow = d.getDay();
          if(selectedDays.includes(dow)){
            const ds = iso(d);
            const exists = state.entries.some(e => e.date === ds && e.mealId === selMeal && e.mealType === selType);
            if(!exists){
              state.entries.push({
                id: uid(),
                date: ds,
                mealId: selMeal,
                mealType: selType,
                servings: mealServings,
                checked: [],
                recurring: true,
                daysOfWeek: [...selectedDays]
              });
              addedCount++;
            }
          }
        }
        save(); closeModal();
        state.activeTab='calendar'; state.selectedDate=targetDateStr; save();
        render();
        showToast(`Scheduled recurring rules for ${addedCount} dates`);
      } else {
        state.entries.push({
          id: uid(),
          date: targetDateStr,
          mealId: selMeal,
          mealType: selType,
          servings: mealServings,
          checked: [],
          recurring: false,
          daysOfWeek: []
        });
        save(); closeModal();
        state.activeTab='calendar'; state.selectedDate=targetDateStr; save();
        render();
        showToast(`Meal added to calendar`);
      }
    };
  }

  openModal(bodyHtml());
  wire();
}

function updateMealListContainer(container){
  container.innerHTML = '';
  const q = state.menuSearchQuery.trim();
  const filtered = state.meals.filter(m=>{
    const matchType = (state.menuFilterType==='all' || m.type===state.menuFilterType);
    if(!matchType) return false;
    if(!q) return true;
    const matchName = m.name.toLowerCase().includes(q);
    const matchIng = m.ingredients.some(i=>i.name.toLowerCase().includes(q));
    return matchName || matchIng;
  });

  if(filtered.length===0){
    container.innerHTML = `<div class="empty">No matching recipes found.</div>`;
    return;
  }

  filtered.forEach(meal=>{
    const card = document.createElement('div');
    card.className='card meal-card';
    const scaledCost = getScaledMealCost(meal);
    const costPerPerson = scaledCost / state.householdSize;

    card.innerHTML = `
      <div class="win-titlebar">
        <span>${meal.name}</span>
        <div class="win-titlebar-controls">
          <button class="win-btn" title="Edit Recipe" data-edit="${meal.id}">-</button>
          <button class="win-btn" title="Delete Recipe" data-del="${meal.id}">×</button>
        </div>
      </div>
      <div class="costline">$${scaledCost.toFixed(2)} for ${state.householdSize} people &middot; $${costPerPerson.toFixed(2)}/p</div>
      <div style="margin-top:6px;">${meal.ingredients.map(i=>`<span class="tag">${i.name}</span>`).join('')}</div>
      ${meal.instructionsUrl?`<div style="margin-top:6px;"><a class="link" href="${meal.instructionsUrl}" target="_blank" rel="noopener">Recipe Source Link &rarr;</a></div>`:''}
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn btn-primary btn-sm" data-plan="${meal.id}">+ Plan on calendar</button>
      </div>
    `;
    container.appendChild(card);
    card.querySelector('[data-edit]').onclick = ()=>openMealForm(meal.id);
    card.querySelector('[data-del]').onclick = ()=>{
      if(confirm(`Remove "${meal.name}" from the recipe box?`)){
        state.meals = state.meals.filter(m=>m.id!==meal.id);
        save(); render();
      }
    };
    card.querySelector('[data-plan]').onclick = ()=>openPlanModal({mealId:meal.id, defaultDate:state.selectedDate});
  });
}

function openMealForm(mealId){
  const editing = !!mealId;
  const meal = editing ? state.meals.find(m=>m.id===mealId) : {
    id:uid(), type:'dinner', name:'', servings:4, costTotal:0, instructionsUrl:'', ingredients:[]
  };
  let draftIngredients = meal.ingredients.map(i=>({...i}));

  function ingredientRowHtml(ing){
    return `
      <div class="ing-edit-row" data-row="${ing.id}">
        <input type="text" placeholder="ingredient name" value="${ing.name}" data-ing-name="${ing.id}">
        <div class="ing-edit-subrow">
          <input type="number" step="0.25" min="0" value="${ing.qty}" data-ing-qty="${ing.id}">
          <select data-ing-unit="${ing.id}">
            ${UNIT_LIST.map(u=>`<option value="${u}" ${u===ing.unit?'selected':''}>${u}</option>`).join('')}
          </select>
          <input type="number" class="cost-input" step="0.01" min="0" placeholder="$" value="${ing.cost||''}" data-ing-cost="${ing.id}">
          <button class="iconbtn" data-ing-remove="${ing.id}">${ICONS.x}</button>
        </div>
      </div>`;
  }

  function bodyHtml(){
    return `
      <h2>${editing?'Edit Recipe':'New Recipe'}</h2>
      <label class="field-label">Recipe Name</label>
      <input type="text" id="mName" value="${meal.name}" placeholder="e.g. Pasta Bake">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label class="field-label">Category</label>
          <select id="mType">
            <option value="breakfast" ${meal.type==='breakfast'?'selected':''}>Breakfast</option>
            <option value="lunch" ${meal.type==='lunch'?'selected':''}>Lunch</option>
            <option value="dinner" ${meal.type==='dinner'?'selected':''}>Dinner</option>
            <option value="snack" ${meal.type==='snack'?'selected':''}>Snack</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="field-label">Base Servings</label>
          <input type="number" id="mServings" value="${meal.servings||4}" min="1">
        </div>
      </div>
      <label class="field-label">Total Cost ($)</label>
      <input type="number" id="mCost" value="${meal.costTotal||''}" step="0.01" min="0">
      <label class="field-label">Recipe Source Link</label>
      <input type="url" id="mLink" value="${meal.instructionsUrl}" placeholder="https://...">
      <label class="field-label">Ingredients</label>
      <div id="ingRows">${draftIngredients.map(ingredientRowHtml).join('')}</div>
      <button class="btn btn-ghost btn-sm" id="addIngRow" style="margin-top:4px;">${ICONS.plus} Add ingredient</button>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn btn-ghost btn-block" id="cancelMeal">Cancel</button>
        <button class="btn btn-primary btn-block" id="saveMeal">Save Recipe</button>
      </div>
    `;
  }

  openModal(bodyHtml());
  wireMealForm();

  function wireMealForm(){
    document.getElementById('cancelMeal').onclick = closeModal;
    document.getElementById('addIngRow').onclick = ()=>{
      const newIng = {id:uid(), name:'', qty:1, unit:'ea', cost:0};
      draftIngredients.push(newIng);
      document.getElementById('ingRows').insertAdjacentHTML('beforeend', ingredientRowHtml(newIng));
      wireIngRow(newIng.id);
    };
    draftIngredients.forEach(ing=>wireIngRow(ing.id));

    document.getElementById('saveMeal').onclick = ()=>{
      const name = document.getElementById('mName').value.trim();
      if(!name){ alert('Give the recipe a name first.'); return; }
      meal.name = name;
      meal.type = document.getElementById('mType').value;
      meal.servings = parseFloat(document.getElementById('mServings').value) || 4;
      meal.costTotal = parseFloat(document.getElementById('mCost').value) || 0;
      meal.instructionsUrl = document.getElementById('mLink').value.trim();
      meal.ingredients = draftIngredients.filter(i=>i.name.trim()!=='');
      if(!editing) state.meals.push(meal);
      save(); closeModal(); render();
    };
  }
  function wireIngRow(id){
    const nameEl = document.querySelector(`[data-ing-name="${id}"]`);
    const qtyEl = document.querySelector(`[data-ing-qty="${id}"]`);
    const unitEl = document.querySelector(`[data-ing-unit="${id}"]`);
    const costEl = document.querySelector(`[data-ing-cost="${id}"]`);
    const rmEl = document.querySelector(`[data-ing-remove="${id}"]`);
    const target = ()=>draftIngredients.find(i=>i.id===id);
    nameEl.oninput = ()=>{ target().name = nameEl.value; };
    qtyEl.oninput = ()=>{ target().qty = parseFloat(qtyEl.value)||0; };
    unitEl.onchange = ()=>{ target().unit = unitEl.value; };
    costEl.oninput = ()=>{ target().cost = parseFloat(costEl.value)||0; };
    rmEl.onclick = ()=>{
      draftIngredients = draftIngredients.filter(i=>i.id!==id);
      document.querySelector(`[data-row="${id}"]`).remove();
    };
  }
}

function renderShoppingTab(view){
  const controls = document.getElementById('topControls');
  controls.innerHTML = `
    <button class="pill" id="clearPurchased">Clear bought</button>
    <button class="pill" id="clearAll">Clear all</button>
  `;
  controls.querySelector('#clearPurchased').onclick = ()=>{
    state.shoppingList = state.shoppingList.filter(i=>!i.purchased);
    save(); render();
  };
  controls.querySelector('#clearAll').onclick = ()=>{
    if(confirm('Clear the entire shopping list?')){ state.shoppingList=[]; save(); render(); }
  };

  const addRow = document.createElement('div');
  addRow.className='card';
  addRow.innerHTML = `
    <label class="field-label">Add item manually</label>
    <input type="text" id="manName" placeholder="item name">
    <div class="ing-edit-subrow">
      <input type="number" id="manQty" step="0.25" value="1">
      <select id="manUnit">${UNIT_LIST.map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
      <input type="number" class="cost-input" id="manCost" step="0.01" min="0" placeholder="$">
      <button class="iconbtn" id="manAdd">${ICONS.plus}</button>
    </div>
  `;
  view.appendChild(addRow);
  addRow.querySelector('#manAdd').onclick = ()=>{
    const name = document.getElementById('manName').value.trim();
    const qty = parseFloat(document.getElementById('manQty').value)||0;
    const unit = document.getElementById('manUnit').value;
    const cost = parseFloat(document.getElementById('manCost').value)||0;
    if(!name || qty<=0) return;
    addIngredientsToShoppingList([{name, qty, unit, cost}]);
    showToast(`Added ${name}`);
    render();
  };

  const receipt = document.createElement('div');
  receipt.className='receipt';
  const items = state.shoppingList.slice().sort((a,b)=> (a.purchased-b.purchased) || a.name.localeCompare(b.name));
  const estTotal = items.filter(i=>!i.purchased).reduce((s,i)=>s+(i.costEstimate||0),0);
  receipt.innerHTML = `
    <div class="receipt-head">
      <div class="store">HEARTH GROCERY</div>
      <div class="meta">${items.length} item${items.length===1?'':'s'} &middot; HH: ${state.householdSize}</div>
    </div>
    <hr>
    ${items.length===0 ? `<div class="empty" style="font-family:var(--font-body); font-size:12px;">List is empty. Uncheck ingredients on a planned meal, or add items above.</div>` :
      items.map(it=>{
        const disp = displayFromBase(it.category, it.base);
        return `<div class="receipt-line ${it.purchased?'purchased':''}" data-item="${it.id}">
          <input type="checkbox" data-buy="${it.id}" ${it.purchased?'checked':''} style="width:16px;height:16px;accent-color:var(--win-blue);">
          <span class="name">${it.name}</span>
          <button class="step-btn" data-step="-1" data-item="${it.id}">&minus;</button>
          <span class="qty">${disp.qty} ${disp.unit}</span>
          <button class="step-btn" data-step="1" data-item="${it.id}">+</button>
          ${it.costEstimate?`<span class="est">$${it.costEstimate.toFixed(2)}</span>`:''}
          <button class="iconbtn" style="padding:2px 4px; font-size:12px;" data-edit-item="${it.id}">&#9998;</button>
          <button class="iconbtn" style="padding:2px 4px; background:#FF0000; color:#FFF;" data-del-item="${it.id}">${ICONS.x}</button>
        </div>`;
      }).join('<hr style="margin:2px 0;">')
    }
    <hr>
    <div class="receipt-total"><span>ITEMS TO BUY</span><span>${items.filter(i=>!i.purchased).length}</span></div>
    <div class="receipt-total est"><span>EST. COST</span><span>$${estTotal.toFixed(2)}</span></div>
  `;
  view.appendChild(receipt);

  receipt.querySelectorAll('[data-buy]').forEach(cb=>{
    cb.onchange = ()=>{
      const item = state.shoppingList.find(i=>i.id===cb.dataset.buy);
      item.purchased = cb.checked;
      save(); render();
    };
  });
  receipt.querySelectorAll('[data-step]').forEach(b=>{
    b.onclick = ()=>{
      const item = state.shoppingList.find(i=>i.id===b.dataset.item);
      const disp = displayFromBase(item.category, item.base);
      const stepBase = UNITS[disp.unit].toBase;
      const delta = parseInt(b.dataset.step,10)*stepBase;
      item.base = Math.max(0, item.base + delta);
      save(); render();
    };
  });
  receipt.querySelectorAll('[data-edit-item]').forEach(b=>{
    b.onclick = ()=>openShoppingItemEdit(b.dataset.editItem);
  });
  receipt.querySelectorAll('[data-del-item]').forEach(b=>{
    b.onclick = ()=>{
      state.shoppingList = state.shoppingList.filter(i=>i.id!==b.dataset.delItem);
      save(); render();
    };
  });
}

function openShoppingItemEdit(itemId){
  const item = state.shoppingList.find(i=>i.id===itemId);
  if(!item) return;
  const disp = displayFromBase(item.category, item.base);
  const catUnits = UNIT_LIST.filter(u=>UNITS[u].cat===item.category);
  openModal(`
    <h2>Edit item</h2>
    <label class="field-label">Name</label>
    <input type="text" id="eName" value="${item.name}">
    <div style="display:flex; gap:8px;">
      <div style="flex:1;"><label class="field-label">Qty</label><input type="number" id="eQty" step="0.25" value="${disp.qty}"></div>
      <div style="flex:1;"><label class="field-label">Unit</label><select id="eUnit">${catUnits.map(u=>`<option value="${u}" ${u===disp.unit?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <label class="field-label">Estimated Cost ($)</label>
    <input type="number" id="eCost" step="0.01" min="0" value="${item.costEstimate||0}">
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn btn-danger btn-block" id="deleteItem">Delete</button>
      <button class="btn btn-primary btn-block" id="saveItem">Save</button>
    </div>
  `);
  document.getElementById('deleteItem').onclick = ()=>{
    state.shoppingList = state.shoppingList.filter(i=>i.id!==itemId);
    save(); closeModal(); render();
  };
  document.getElementById('saveItem').onclick = ()=>{
    const name = document.getElementById('eName').value.trim();
    const qty = parseFloat(document.getElementById('eQty').value)||0;
    const unit = document.getElementById('eUnit').value;
    const cost = parseFloat(document.getElementById('eCost').value)||0;
    if(!name) return;
    item.name = name; item.key = name.toLowerCase();
    item.base = qty * UNITS[unit].toBase;
    item.costEstimate = cost;
    save(); closeModal(); render();
    showToast('Item updated');
  };
}

    <div style="display:flex; gap:8px;">
      <div style="flex:1;"><label class="field-label">Qty</label><input type="number" id="pQty" step="0.25" value="${item.qty}"></div>
      <div style="flex:1;"><label class="field-label">Unit</label><select id="pUnit">${UNIT_LIST.map(u=>`<option value="${u}" ${u===item.unit?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      ${editing ? '<button class="btn btn-danger btn-block" id="deletePantry">Delete</button>' : ''}
      <button class="btn btn-primary btn-block" id="savePantry">${editing ? 'Save' : 'Add'}</button>
    </div>
  `);

  if(editing){
    document.getElementById('deletePantry').onclick = ()=>{
      state.pantry = state.pantry.filter(p=>p.id!==pantryId);
      save(); closeModal(); render();
      showToast('Item removed');
    };
  }

  document.getElementById('savePantry').onclick = ()=>{
    const name = document.getElementById('pName').value.trim();
    const qty = parseFloat(document.getElementById('pQty').value)||0;
    const unit = document.getElementById('pUnit').value;
    if(!name) return;
    
    if(editing){
      item.name = name;
      item.key = name.toLowerCase();
      item.qty = qty;
      item.unit = unit;
    } else {
      state.pantry.push({ id:uid(), key:name.toLowerCase(), name, qty, unit });
    }
    save(); closeModal(); render();
    showToast(editing ? 'Item updated' : 'Added to pantry');
  };
}

/* ============================= BUDGET & RULE BUILDER TAB ============================= */
function renderBudgetTab(view){
  const controls = document.getElementById('topControls');
  controls.innerHTML = `
    <button class="pill active" id="addRuleBtn">${ICONS.plus} Add Recurring Budget Rule</button>
  `;
  controls.querySelector('#addRuleBtn').onclick = openRuleBuilderModal;

  const ruleCard = document.createElement('div');
  ruleCard.className = 'card';
  ruleCard.innerHTML = `<h2 class="section-title">Recurring Rule Templates</h2>`;
  
  if(!state.ruleTemplates || state.ruleTemplates.length === 0){
    ruleCard.innerHTML += `<div class="empty" style="font-size:14px; padding:12px;">No recurring rules created yet. Click above to add items like Cereal (5 times/wk at 3 servings) to project into your budget!</div>`;
  } else {
    state.ruleTemplates.forEach(r => {
      const meal = state.meals.find(m => m.id === r.mealId);
      const mealName = meal ? meal.name : 'Unknown Recipe';
      const baseServings = meal ? (meal.servings || 4) : 4;
      const costPerPerson = meal ? ((meal.costTotal || 0) / baseServings) : 0;
      const weeklyCost = costPerPerson * r.servings * r.frequency;

      const row = document.createElement('div');
      row.className = 'ing-row';
      row.innerHTML = `
        <span><strong>${mealName}</strong> &middot; ${r.frequency}x/wk &middot; ${r.servings} servings</span>
        <span class="ing-qty">$${weeklyCost.toFixed(2)}/wk</span>
        <button class="iconbtn" style="background:#FF0000; color:#FFF; padding:2px 6px;" data-del-rule="${r.id}">${ICONS.x}</button>
      `;
      row.querySelector('[data-del-rule]').onclick = ()=>{
        state.ruleTemplates = state.ruleTemplates.filter(x => x.id !== r.id);
        save(); render();
        showToast('Rule removed');
      };
      ruleCard.appendChild(row);
    });
  }
  view.appendChild(ruleCard);

  // Calculate projected budget from rules + calendar entries
  let ruleWeeklyTotal = 0;
  if(state.ruleTemplates){
    state.ruleTemplates.forEach(r => {
      const meal = state.meals.find(m => m.id === r.mealId);
      if(meal){
        const baseServings = meal.servings || 4;
        const costPerPerson = (meal.costTotal || 0) / baseServings;
        ruleWeeklyTotal += costPerPerson * r.servings * r.frequency;
      }
    });
  }

  const start = startOfWeek(state.anchorDate);
  const end = addDays(start,6);
  const rangeEntries = state.entries.filter(e=> e.date>=iso(start) && e.date<=iso(end));
  const calendarTotal = rangeEntries.reduce((sum,e)=>{
    const meal = state.meals.find(m=>m.id===e.mealId);
    return sum + (meal ? getScaledMealCostForEntry(meal, e) : 0);
  },0);

  const combinedTotal = ruleWeeklyTotal + calendarTotal;
  const pct = state.budgetTarget>0 ? Math.min(100, Math.round((combinedTotal/state.budgetTarget)*100)) : 0;
  const over = combinedTotal > state.budgetTarget;

  const targetCard = document.createElement('div');
  targetCard.className='card';
  targetCard.innerHTML = `
    <div class="budget-header">
      <span>This Week Projection (${niceDate(start)} – ${niceDate(end)})</span>
      <span>Target: <input type="number" id="targetInput" value="${state.budgetTarget}" style="width:64px; padding:2px;"></span>
    </div>
    <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${pct}%; background:${over?'#FF0000':'#2E6F40'}"></div></div>
    <div class="row-between" style="margin-top:6px;">
      <span class="budget-target-num" style="color:${over?'#FF0000':'var(--win-blue)'}">$${combinedTotal.toFixed(2)} projected</span>
      <span style="font-size:11.5px; color:#666;">of $${state.budgetTarget.toFixed(2)}</span>
    </div>
    <div style="font-size:11px; color:#555; margin-top:6px;">
      &bull; Calendar meals: $${calendarTotal.toFixed(2)}<br>
      &bull; Recurring rule templates: $${ruleWeeklyTotal.toFixed(2)}
    </div>
  `;
  view.appendChild(targetCard);
  targetCard.querySelector('#targetInput').onchange = (e)=>{
    state.budgetTarget = parseFloat(e.target.value)||0; save(); render();
  };
}

function openRuleBuilderModal(){
  if(state.meals.length===0){
    openModal(`<h2>No recipes yet</h2><p>Add a recipe in the Menu tab first.</p><button class="btn btn-primary btn-block" id="closeM">Got it</button>`);
    document.getElementById('closeM').onclick = closeModal;
    return;
  }
  let selMeal = state.meals[0].id;
  let frequency = 5; // e.g. 5 times a week
  let servings = state.householdSize; // e.g. 3 servings

  openModal(`
    <h2>Recurring Budget Rule Builder</h2>
    <label class="field-label">Select Recipe</label>
    <select id="ruleMealSelect">${state.meals.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select>
    
    <label class="field-label">Times Used Per Week (Frequency)</label>
    <input type="number" id="ruleFreqInput" value="${frequency}" min="1" max="7">

    <label class="field-label">Servings Per Use</label>
    <input type="number" id="ruleServInput" value="${servings}" min="1" max="100">

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn btn-ghost btn-block" id="cancelRule">Cancel</button>
      <button class="btn btn-primary btn-block" id="saveRule">Save Rule</button>
    </div>
  `);

  document.getElementById('cancelRule').onclick = closeModal;
  document.getElementById('ruleMealSelect').onchange = (e)=>{ selMeal = e.target.value; };
  document.getElementById('ruleFreqInput').onchange = (e)=>{ frequency = parseInt(e.target.value, 10) || 1; };
  document.getElementById('ruleServInput').onchange = (e)=>{ servings = parseInt(e.target.value, 10) || 1; };

  document.getElementById('saveRule').onclick = ()=>{
    if(!state.ruleTemplates) state.ruleTemplates = [];
    state.ruleTemplates.push({
      id: uid(),
      mealId: selMeal,
      frequency: frequency,
      servings: servings
    });
    save(); closeModal(); render();
    showToast('Recurring budget rule added');
  };
}

/* ============================= MODAL ============================= */
function openModal(innerHtml){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="backdrop"><div class="modal">${innerHtml}</div></div>`;
  document.getElementById('backdrop').onclick = (e)=>{ if(e.target.id==='backdrop') closeModal(); };
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
