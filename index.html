<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Hearth — Family Meal Planner</title>
<meta name="theme-color" content="#8B263E">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2C221E;
  --ink-soft:#6E5E57;
  --bg:#FAF6F0;
  --card:#FFFFFF;
  --card-line:#EADFD6;
  --primary:#8B263E;
  --primary-dark:#691A2E;
  --accent:#2E6F40;
  --accent-dark:#1E4A2A;
  --gold:#D99B26;
  --gold-dark:#A67215;
  --paper-shadow: 0 2px 8px rgba(44,34,30,.06), 0 8px 20px rgba(44,34,30,.04);
  --radius: 16px;
  --disp: 'Plus Jakarta Sans', system-ui, sans-serif;
  --body: 'Inter', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  position:relative;
}
/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--primary);
  color:#FFF9F5;
  padding:14px 16px 12px;
  border-bottom:3px solid var(--gold);
}
.topbar-header{
  display:flex; justify-content:space-between; align-items:baseline;
}
.topbar h1{
  font-family:var(--disp);
  font-weight:800;
  font-size:22px;
  margin:0 0 2px;
  letter-spacing:.2px;
}
.version-tag{
  font-family:var(--mono);
  font-size:11px;
  color:rgba(255,249,245,.75);
  background:rgba(0,0,0,.15);
  padding:2px 6px;
  border-radius:6px;
}
.topbar .sub{
  font-size:12px;
  color:#F0D1D7;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.08em;
}
.topbar-controls{
  margin-top:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
/* ---------- main ---------- */
#view{
  flex:1;
  padding:14px 14px 96px;
  overflow-y:auto;
}
h2.section-title{
  font-family:var(--disp);
  font-weight:700;
  font-size:18px;
  margin:0 0 10px;
  color:var(--ink);
}
.card{
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:var(--radius);
  box-shadow:var(--paper-shadow);
  padding:14px;
  margin-bottom:12px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid rgba(255,249,245,.25);
  background:rgba(255,255,255,.1);
  color:#FFF9F5;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s;
}
.pill.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#3A2A04;
}
.chip{
  display:inline-flex; align-items:center; gap:4px;
  padding:6px 12px; border-radius:999px;
  border:1.5px solid var(--card-line); background:#fff; color:var(--ink);
  font-size:13px; font-weight:600; cursor:pointer;
}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:10px; padding:10px 14px;
  font-weight:600; font-size:14px; cursor:pointer;
  font-family:var(--body);
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-teal{background:var(--accent); color:#fff;}
.btn-teal:active{background:var(--accent-dark);}
.btn-gold{background:var(--gold); color:#3A2A04;}
.btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--card-line);}
.btn-danger{background:transparent; color:var(--primary-dark); border:1.5px solid var(--primary-dark);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:8px;}
input[type=text],input[type=number],input[type=url],input[type=date],select,textarea{
  width:100%;
  padding:9px 10px;
  border:1.5px solid var(--card-line);
  border-radius:9px;
  font-family:var(--body);
  font-size:14px;
  background:#fff;
  color:var(--ink);
}
label.field-label{
  display:block; font-size:11.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-soft); margin:10px 0 4px;
}
/* ---------- bottom tab bar ---------- */
.tabbar{
  position:sticky; bottom:0; z-index:20;
  display:flex;
  background:var(--primary);
  border-top:3px solid var(--gold);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbtn{
  flex:1;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:#E8B4BE; padding:6px 2px; cursor:pointer;
}
.tabbtn svg{width:20px;height:20px;}
.tabbtn span{font-size:10px; font-weight:600; letter-spacing:.02em;}
.tabbtn.active{color:#FFF9F5;}
.tabbtn.active svg{color:var(--gold);}
/* ---------- calendar ---------- */
.cal-grid-month{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-dow{font-family:var(--mono); font-size:10px; color:var(--ink-soft); text-align:center; padding-bottom:4px;}
.cal-day-month{
  background:var(--card); border:1px solid var(--card-line); border-radius:8px;
  min-height:56px; padding:4px; cursor:pointer; position:relative;
}
.cal-day-month.today{border-color:var(--primary); border-width:2px;}
.cal-day-month.selected{background:#F7EBEB;}
.cal-day-month.other-month{opacity:.35;}
.cal-daynum{font-family:var(--mono); font-size:11px; font-weight:600;}
.badge-row{display:flex; flex-wrap:wrap; gap:2px; margin-top:3px;}
.type-badge{
  width:15px; height:15px; border-radius:4px; color:#fff; font-size:9px; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center; font-family:var(--mono); flex:0 0 auto;
}
.cal-week-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x mandatory;}
.cal-week-day{
  flex:0 0 84%; scroll-snap-align:start; background:var(--card); border:1px solid var(--card-line);
  border-radius:var(--radius); padding:10px; min-height:180px;
}
.cal-week-day.today{border-color:var(--primary); border-width:2px;}
.cal-week-day h3{font-family:var(--disp); font-size:15px; margin:0 0 8px;}
.week-meal-row{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:6px 8px; border-radius:8px; background:#fff; border:1px solid var(--card-line);
  border-left-width:4px; border-left-style:solid;
  margin-bottom:6px; font-size:13px; cursor:pointer;
}
.week-meal-row .mname{flex:1;}
.week-meal-row .cost{font-family:var(--mono); font-size:12px; color:var(--ink-soft);}
.day-detail{margin-top:14px;}
.ing-row{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--card-line); font-size:14px;}
.ing-row.checked{opacity:.5; text-decoration:line-through;}
.ing-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent);}
.ing-qty{font-family:var(--mono); color:var(--ink-soft); font-size:12.5px; margin-left:auto;}
/* ---------- receipt (shopping list signature) ---------- */
.receipt{
  background:#fff;
  border:1px solid var(--card-line);
  border-radius:2px;
  padding:18px 16px 8px;
  font-family:var(--mono);
  box-shadow:var(--paper-shadow);
  position:relative;
}
.receipt::before, .receipt::after{
  content:""; position:absolute; left:0; right:0; height:10px;
  background-image:radial-gradient(circle at 6px 5px, var(--bg) 5px, transparent 5.5px);
  background-size:12px 10px; background-repeat:repeat-x;
}
.receipt::before{top:-6px;}
.receipt::after{bottom:-6px; transform:rotate(180deg);}
.receipt-head{text-align:center; margin-bottom:10px;}
.receipt-head .store{font-family:var(--disp); font-weight:800; font-size:17px; letter-spacing:.03em;}
.receipt-head .meta{font-size:10.5px; color:var(--ink-soft);}
.receipt hr{border:none; border-top:1px dashed var(--card-line); margin:8px 0;}
.receipt-line{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:5px 0;}
.receipt-line .name{flex:1; font-size:13px;}
.receipt-line.purchased .name{text-decoration:line-through; opacity:.45;}
.receipt-line .qty{white-space:nowrap; font-weight:600;}
.receipt-line .est{white-space:nowrap; color:var(--gold-dark); font-size:11.5px;}
.step-btn{
  width:20px; height:20px; border-radius:5px; border:none; background:#F4ECE1;
  font-weight:700; cursor:pointer; font-family:var(--mono); line-height:1; color:var(--ink);
}
.receipt-total{display:flex; justify-content:space-between; font-weight:700; font-size:14px; padding-top:8px;}
.receipt-total.est{color:var(--gold-dark); font-size:13px; padding-top:2px;}
/* ---------- misc ---------- */
.empty{
  text-align:center; padding:32px 16px; color:var(--ink-soft);
  font-size:14px;
}
.tag{
  display:inline-block; font-family:var(--mono); font-size:10.5px; padding:2px 7px;
  border-radius:5px; background:#F4ECE1; color:var(--ink-soft); margin-right:4px;
}
.match-bar-track{background:#F4ECE1; border-radius:6px; height:8px; overflow:hidden; margin-top:6px;}
.match-bar-fill{height:100%; background:var(--accent);}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(44,34,30,.55); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal{
  background:var(--bg); width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:slideup .18s ease-out;
}
@keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal h2{font-family:var(--disp); margin:0 0 12px;}
.ing-edit-row{margin-bottom:8px;}
.ing-edit-subrow{display:flex; gap:6px; margin-top:4px; align-items:center;}
.ing-edit-subrow input[type=number]{width:52px; flex:0 0 52px; padding:9px 6px;}
.ing-edit-subrow select{flex:0 0 62px; padding:9px 4px;}
.ing-edit-subrow .cost-input{flex:0 0 58px;}
.ing-edit-subrow .iconbtn{margin-left:auto;}
.iconbtn{background:none;border:none;color:var(--primary-dark);cursor:pointer;font-size:18px;padding:4px 8px;}
.row-between{display:flex; justify-content:space-between; align-items:center;}
.meal-card h3{font-family:var(--disp); font-size:16px; margin:0 0 4px;}
.meal-card .costline{font-family:var(--mono); font-size:13px; color:var(--accent-dark); font-weight:600;}
.budget-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.budget-target-num{font-family:var(--mono); font-weight:700;}
.budget-bar-track{background:#F4ECE1; border-radius:8px; height:14px; overflow:hidden;}
.budget-bar-fill{height:100%;}
a.link{color:var(--accent-dark); font-size:12.5px;}
#toast{
  position:fixed; left:50%; bottom:82px; transform:translate(-50%,12px);
  background:var(--ink); color:#FFF9F5; padding:10px 16px; border-radius:10px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  z-index:60; max-width:80%; text-align:center; box-shadow:var(--paper-shadow);
}
#toast.show{opacity:1; transform:translate(-50%,0);}
::-webkit-scrollbar{display:none;}
</style>
</head>

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    const def = defaultState();
    if(!raw) return def;
    const parsed = JSON.parse(raw);
    const merged = {...def, ...parsed};
    if(!merged.meals || merged.meals.length === 0){
      merged.meals = def.meals;
    }
    merged.householdSize = merged.householdSize || 5;
    merged.menuSearchQuery = merged.menuSearchQuery || '';
    merged.menuFilterType = merged.menuFilterType || 'all';
    merged.entryStops = merged.entryStops || [];
    merged.entries = (merged.entries||[]).map(e=>({mealType:'dinner', servings:merged.householdSize, checked:[], recurring:false, ...e}));
    merged.shoppingList = (merged.shoppingList||[]).map(i=>({costEstimate:0, purchased:false, ...i}));
    return merged;
  }catch(e){ return defaultState(); }
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ============================= SCALING HELPERS ============================= */
function getEntryServings(entry){
  return entry.servings !== undefined ? entry.servings : state.householdSize;
}
function getScaledMealCostForEntry(meal, entry){
  const baseServings = meal.servings || 4;
  const costPerPerson = (meal.costTotal || 0) / baseServings;
  return costPerPerson * getEntryServings(entry);
}
function getScaledQtyForEntry(qty, meal, entry){
  const baseServings = meal.servings || 4;
  return qty * (getEntryServings(entry) / baseServings);
}
function getScaledIngredientCostForEntry(ingCost, meal, entry){
  const baseServings = meal.servings || 4;
  const costPerPerson = (ingCost || 0) / baseServings;
  return costPerPerson * getEntryServings(entry);
}

/* ============================= RECURRING AUTO-GENERATOR ============================= */
function checkRecurringEntries(){
  let updated = false;
  state.entryStops = state.entryStops || [];
  state.entries.forEach(entry => {
    if(entry.recurring){
      const originalDate = new Date(entry.date+'T00:00:00');
      const dayOfWeek = originalDate.getDay();
      for(let i=1; i<=28; i++){
        const checkDate = new Date();
        checkDate.setDate(checkDate.getDate() + i);
        if(checkDate.getDay() === dayOfWeek){
          const checkIso = iso(checkDate);
          
          const isStopped = state.entryStops.some(s => s.mealId === entry.mealId && s.date === checkIso);
          if(isStopped) continue;

          const exists = state.entries.some(e => e.date === checkIso && e.mealId === entry.mealId && e.mealType === entry.mealType);
          if(!exists){
            state.entries.push({
              id: uid(),
              date: checkIso,
              mealId: entry.mealId,
              mealType: entry.mealType,
              servings: entry.servings,
              checked: [],
              recurring: true
            });
            updated = true;
          }
        }
      }
    }
  });
  if(updated) save();
}
checkRecurringEntries();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ============================= UNIT HELPERS ============================= */
function toBase(qty, unit){ return qty * UNITS[unit].toBase; }
function displayFromBase(cat, baseQty){
  if(cat==='count') return {qty: round4(baseQty), unit:'ea'};
  if(cat==='weight'){
    if(baseQty >= 16) return {qty: round4(baseQty/16), unit:'lb'};
    return {qty: round4(baseQty), unit:'oz'};
  }
  if(baseQty >= 192) return {qty: round4(baseQty/192), unit:'qt'};
  if(baseQty >= 48)  return {qty: round4(baseQty/48), unit:'cup'};
  if(baseQty >= 3)   return {qty: round4(baseQty/3), unit:'tbsp'};
  return {qty: round4(baseQty), unit:'tsp'};
}
function round4(n){
  const r = Math.round(n*4)/4;
  return r % 1 === 0 ? r : Math.round(r*100)/100;
}
function fmtQtyUnit(qty, unit){ return `${round4(qty)} ${unit}`; }

/* ============================= SHOPPING LIST AGGREGATION ============================= */
function addIngredientsToShoppingListForEntry(meal, entry){
  let added = 0;
  meal.ingredients.forEach(ing=>{
    if(entry.checked.includes(ing.id)) return;
    const scaledQty = getScaledQtyForEntry(ing.qty, meal, entry);
    const scaledCost = getScaledIngredientCostForEntry(ing.cost, meal, entry);
    const cat = UNITS[ing.unit].cat;
    const base = toBase(scaledQty, ing.unit);
    const key = ing.name.trim().toLowerCase();
    let item = state.shoppingList.find(i => i.key===key && i.category===cat);
    if(item){
      item.base += base;
      item.costEstimate = (item.costEstimate||0) + scaledCost;
    } else {
      state.shoppingList.push({id:uid(), key, name:ing.name.trim(), category:cat, base, purchased:false, costEstimate: scaledCost});
    }
    added++;
  });
  save();
  return added;
}

/* ============================= PANTRY MATCH ============================= */
function pantryHas(name){
  const key = name.trim().toLowerCase();
  return state.pantry.find(p=>(p.key||p.name.toLowerCase())===key);
}
function mealMatchPct(meal){
  if(!meal.ingredients.length) return 0;
  const have = meal.ingredients.filter(ing=>pantryHas(ing.name)).length;
  return Math.round((have/meal.ingredients.length)*100);
}

    <button class="tabbtn ${state.activeTab===t.id?'active':''}" data-tab="${t.id}">
      ${ICONS[t.icon]}<span>${t.label}</span>
    </button>`).join('');
  bar.querySelectorAll('.tabbtn').forEach(b=>{
    b.onclick = ()=>{ state.activeTab = b.dataset.tab; save(); render(); };
  });
}

/* ============================= ROUTER ============================= */
function render(){
  renderTabbar();
  document.getElementById('topControls').innerHTML='';
  const view = document.getElementById('view');
  const subEl = document.getElementById('topSub');
  const routes = {
    calendar: renderCalendarTab,
    menu: renderMenuTab,
    shopping: renderShoppingTab,
    pantry: renderPantryTab,
    budget: renderBudgetTab,
  };
  const subs = {
    calendar:'FAMILY MEAL PLANNER', menu:'RECIPE BOX', shopping:'SHOPPING LIST',
    pantry:'ON-HAND INVENTORY', budget:'MEAL BUDGET',
  };
  subEl.textContent = subs[state.activeTab];
  view.innerHTML='';
  routes[state.activeTab](view);
}

/* ============================= DATE HELPERS ============================= */
function startOfWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate() - d.getDay());
  return d;
}
function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function iso(d){ return d.toISOString().slice(0,10); }
function niceDate(d){ return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }
function byType(a,b){ return TYPE_ORDER.indexOf(a.mealType)-TYPE_ORDER.indexOf(b.mealType); }

/* ============================= CALENDAR TAB ============================= */
function renderCalendarTab(view){
  const controls = document.getElementById('topControls');
  controls.innerHTML = `
    <div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.15); padding:4px 10px; border-radius:999px; border:1px solid rgba(255,249,245,.3);">
      <span style="font-size:12px; font-weight:600; color:#FFF9F5;">Default Servings:</span>
      <input type="number" id="globalServingsInput" value="${state.householdSize}" min="1" max="100" style="width:44px; padding:2px 4px; font-size:13px; font-weight:700; text-align:center; border-radius:6px; border:none; background:#fff; color:var(--ink);">
    </div>
    <button class="pill ${state.calendarView==='week'?'active':''}" id="viewWeekBtn">Week</button>
    <button class="pill ${state.calendarView==='month'?'active':''}" id="viewMonthBtn">Month</button>
  `;
  controls.querySelector('#globalServingsInput').onchange = (e)=>{
    const val = parseInt(e.target.value, 10);
    if(val > 0){ state.householdSize = val; save(); render(); }
  };
  controls.querySelector('#viewWeekBtn').onclick=()=>{state.calendarView='week'; save(); render();};
  controls.querySelector('#viewMonthBtn').onclick=()=>{state.calendarView='month'; save(); render();};

  if(state.calendarView==='week') renderWeekView(view);
  else renderMonthView(view);

  renderDayDetail(view);
}

function renderWeekView(view){
  const wrap = document.createElement('div');
  const start = startOfWeek(state.anchorDate);
  const nav = document.createElement('div');
  nav.className='row-between';
  nav.style.marginBottom='10px';
  nav.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="prevWeek">&larr; Prev</button>
    <strong>${niceDate(start)} – ${niceDate(addDays(start,6))}</strong>
    <button class="btn btn-ghost btn-sm" id="nextWeek">Next &rarr;</button>
  `;
  wrap.appendChild(nav);

  const row = document.createElement('div');
  row.className='cal-week-row';
  for(let i=0;i<7;i++){
    const d = addDays(start,i);
    const ds = iso(d);
    const dayEntries = state.entries.filter(e=>e.date===ds).slice().sort(byType);
    const col = document.createElement('div');
    col.className = 'cal-week-day' + (ds===todayISO()?' today':'');
    col.innerHTML = `<h3>${d.toLocaleDateString(undefined,{weekday:'short'})} <span style="color:var(--ink-soft); font-weight:400;">${d.getDate()}</span></h3>`;
    if(dayEntries.length===0){
      col.innerHTML += `<div style="font-size:12px;color:var(--ink-soft);">No meals planned</div>`;
    } else {
      dayEntries.forEach(e=>{
        const meal = state.meals.find(m=>m.id===e.mealId);
        if(!meal) return;
        const scaledCost = getScaledMealCostForEntry(meal, e);
        const r = document.createElement('div');
        r.className='week-meal-row';
        r.style.borderLeftColor = TYPE_COLORS[e.mealType];
        r.innerHTML = `<span class="type-badge" style="background:${TYPE_COLORS[e.mealType]}">${TYPE_LABELS[e.mealType]}</span><span class="mname">${meal.name} (${getEntryServings(e)}p) ${e.recurring?'<span style="font-size:10px;color:var(--gold-dark);">&#8635;</span>':''}</span><span class="cost">$${scaledCost.toFixed(2)}</span>`;
        r.onclick = ()=>{ state.selectedDate = ds; save(); render(); };
        col.appendChild(r);
      });
    }
    const addBtn = document.createElement('button');
    addBtn.className='btn btn-ghost btn-sm btn-block';
    addBtn.style.marginTop='6px';
    addBtn.textContent='+ Add meal';
    addBtn.onclick=()=>openPlanModal({defaultDate:ds});
    col.appendChild(addBtn);
    row.appendChild(col);
  }
  wrap.appendChild(row);
  view.appendChild(wrap);

  wrap.querySelector('#prevWeek').onclick = ()=>{ state.anchorDate = iso(addDays(start,-7)); save(); render(); };
  wrap.querySelector('#nextWeek').onclick = ()=>{ state.anchorDate = iso(addDays(start,7)); save(); render(); };
}

function renderMonthView(view){
  const wrap = document.createElement('div');
  const anchor = new Date(state.anchorDate+'T00:00:00');
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const gridStart = addDays(first, -first.getDay());

  const nav = document.createElement('div');
  nav.className='row-between';
  nav.style.marginBottom='10px';
  nav.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="prevMonth">&larr;</button>
    <strong>${anchor.toLocaleDateString(undefined,{month:'long', year:'numeric'})}</strong>
    <button class="btn btn-ghost btn-sm" id="nextMonth">&rarr;</button>
  `;
  wrap.appendChild(nav);

  const legend = document.createElement('div');
  legend.style.cssText='display:flex; gap:10px; margin-bottom:8px; font-size:11px; color:var(--ink-soft); flex-wrap:wrap;';
  legend.innerHTML = TYPE_ORDER.map(t=>`<span style="display:inline-flex;align-items:center;gap:4px;"><span class="type-badge" style="background:${TYPE_COLORS[t]}; width:13px;height:13px;font-size:8px;">${TYPE_LABELS[t]}</span>${TYPE_NAMES[t]}</span>`).join('');
  wrap.appendChild(legend);

  const grid = document.createElement('div');
  grid.className='cal-grid-month';
  ['S','M','T','W','T','F','S'].forEach(d=>{
    const el = document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });
  for(let i=0;i<42;i++){
    const d = addDays(gridStart, i);
    const ds = iso(d);
    const dayEntries = state.entries.filter(e=>e.date===ds).slice().sort(byType);
    const cell = document.createElement('div');
    cell.className = 'cal-day-month'
      + (ds===todayISO()?' today':'')
      + (ds===state.selectedDate?' selected':'')
      + (d.getMonth()!==anchor.getMonth()?' other-month':'');
    const badges = dayEntries.map(e=>`<span class="type-badge" style="background:${TYPE_COLORS[e.mealType]}">${TYPE_LABELS[e.mealType]}</span>`).join('');
    cell.innerHTML = `<div class="cal-daynum">${d.getDate()}</div><div class="badge-row">${badges}</div>`;
    cell.onclick = ()=>{ state.selectedDate = ds; save(); render(); };
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  view.appendChild(wrap);

  wrap.querySelector('#prevMonth').onclick = ()=>{
    const p = new Date(anchor.getFullYear(), anchor.getMonth()-1, 1);
    state.anchorDate = iso(p); save(); render();
  };
  wrap.querySelector('#nextMonth').onclick = ()=>{
    const n = new Date(anchor.getFullYear(), anchor.getMonth()+1, 1);
    state.anchorDate = iso(n); save(); render();
  };
}

function renderDayDetail(view){
  const wrap = document.createElement('div');
  wrap.className='day-detail';
  const d = new Date(state.selectedDate+'T00:00:00');
  const entries = state.entries.filter(e=>e.date===state.selectedDate).slice().sort(byType);

  const head = document.createElement('div');
  head.className='row-between';
  head.innerHTML = `<h2 class="section-title" style="margin-bottom:0;">${niceDate(d)}</h2>`;
  const addBtn = document.createElement('button');
  addBtn.className='btn btn-primary btn-sm';
  addBtn.innerHTML = `${ICONS.plus} Add meal`;
  addBtn.onclick = ()=>openPlanModal({defaultDate:state.selectedDate});
  head.appendChild(addBtn);
  wrap.appendChild(head);

  if(entries.length===0){
    wrap.innerHTML += `<div class="empty">No meals planned for this day yet.</div>`;
  }

  entries.forEach(entry=>{
    const meal = state.meals.find(m=>m.id===entry.mealId);
    if(!meal) return;
    const currentServings = getEntryServings(entry);
    const scaledCost = getScaledMealCostForEntry(meal, entry);
    const costPerPerson = scaledCost / currentServings;

    const card = document.createElement('div');
    card.className='card';
    let ingHtml = meal.ingredients.map(ing=>{
      const checked = entry.checked.includes(ing.id);
      const scaledQty = getScaledQtyForEntry(ing.qty, meal, entry);
      const scaledIngCost = getScaledIngredientCostForEntry(ing.cost, meal, entry);
      return `
        <div class="ing-row ${checked?'checked':''}" data-ing="${ing.id}">
          <input type="checkbox" ${checked?'checked':''} data-ing-cb="${ing.id}">
          <span>${ing.name}</span>
          <span class="ing-qty">${fmtQtyUnit(scaledQty, ing.unit)}${ing.cost?` &middot; $${scaledIngCost.toFixed(2)}`:''}</span>
        </div>`;
    }).join('');

    card.innerHTML = `
      <div class="row-between">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="type-badge" style="background:${TYPE_COLORS[entry.mealType]}; width:18px;height:18px;font-size:10px;">${TYPE_LABELS[entry.mealType]}</span>
          <h3 style="font-family:var(--disp); margin:0;">${meal.name} ${entry.recurring?'<span style="font-size:12px;color:var(--gold-dark);" title="Recurring weekly">&#8635;</span>':''}</h3>
        </div>
        <div style="display:flex; gap:4px; align-items:center;">
          <button class="iconbtn" title="Duplicate record" data-duplicate-entry="${entry.id}">${ICONS.copy}</button>
          <button class="iconbtn" title="Remove" data-remove-entry="${entry.id}">${ICONS.x}</button>
        </div>
      </div>
      <div class="costline" style="margin-top:4px; display:flex; justify-content:space-between; align-items:center;">
        <span>$${scaledCost.toFixed(2)} total &middot; $${costPerPerson.toFixed(2)}/person</span>
        <div style="display:flex; align-items:center; gap:4px;">
          <span style="font-size:11px; font-weight:600; color:var(--ink-soft);">Servings:</span>
          <input type="number" min="1" value="${currentServings}" data-entry-servings="${entry.id}" style="width:42px; padding:2px 4px; font-size:12px; font-weight:700; text-align:center;">
        </div>
      </div>
      ${meal.instructionsUrl?`<a class="link" href="${meal.instructionsUrl}" target="_blank" rel="noopener" style="display:block; margin-top:4px;">Instructions &rarr;</a>`:''}
      <div style="margin-top:8px;">${ingHtml}</div>
      <div style="display:flex; gap:8px; margin-top:10px; align-items:center;">
        <button class="btn btn-teal btn-sm" style="flex:1;" data-add-unchecked="${entry.id}">Add unchecked to list</button>
        <button class="btn btn-ghost btn-sm ${entry.recurring?'active':''}" data-toggle-recurring="${entry.id}" style="${entry.recurring?'background:var(--gold);color:#3A2A04;border-color:var(--gold);':''}">${entry.recurring?'Recurring (On)':'Make Recurring'}</button>
      </div>
    `;
    wrap.appendChild(card);

    card.querySelector(`[data-entry-servings="${entry.id}"]`).onchange = (e)=>{
      const newS = parseInt(e.target.value, 10);
      if(newS > 0){
        entry.servings = newS;
        save(); render();
      }
    };
    card.querySelectorAll('[data-ing-cb]').forEach(cb=>{
      cb.onchange = ()=>{
        const ingId = cb.dataset.ingCb;
        if(cb.checked){ if(!entry.checked.includes(ingId)) entry.checked.push(ingId); }
        else { entry.checked = entry.checked.filter(x=>x!==ingId); }
        save(); render();
      };
    });
    card.querySelector('[data-remove-entry]').onclick = ()=>{
      if(entry.recurring){
        openStopRecurringModal(entry);
        return;
      }
      state.entries = state.entries.filter(e=>e.id!==entry.id);
      save(); render();
      showToast('Meal removed from day');
    };
    card.querySelector('[data-duplicate-entry]').onclick = ()=>{
      state.entries.push({
        id: uid(),
        date: entry.date,
        mealId: entry.mealId,
        mealType: entry.mealType,
        servings: entry.servings,
        checked: [...entry.checked],
        recurring: false
      });
      save(); render();
      showToast('Meal record duplicated');
    };
    card.querySelector('[data-toggle-recurring]').onclick = ()=>{
      entry.recurring = !entry.recurring;
      if(entry.recurring) checkRecurringEntries();
      save(); render();
      showToast(entry.recurring ? 'Set as recurring weekly!' : 'Recurring turned off');
    };
    card.querySelector('[data-add-unchecked]').onclick = ()=>{
      const addedCount = addIngredientsToShoppingListForEntry(meal, entry);
      if(addedCount === 0){ showToast('Already added — nothing unchecked left.'); return; }
      meal.ingredients.forEach(ing => {
        if(!entry.checked.includes(ing.id)) entry.checked.push(ing.id);
      });
      save();
      showToast(`Added scaled ingredients to shopping list`);
      render();
    };
  });

  view.appendChild(wrap);
}

function openStopRecurringModal(entry){
  openModal(`
    <h2>Manage Recurring Meal</h2>
    <p style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">This is part of a recurring series. How would you like to remove it?</p>
    <button class="btn btn-ghost btn-block" id="delOnlyThis" style="margin-bottom:8px;">Delete only this instance</button>
    <button class="btn btn-danger btn-block" id="delForward" style="margin-bottom:12px;">Stop recurrence from this date forward</button>
    <button class="btn btn-primary btn-block" id="cancelStop">Cancel</button>
  `);
  document.getElementById('cancelStop').onclick = closeModal;
  document.getElementById('delOnlyThis').onclick = ()=>{
    state.entries = state.entries.filter(e=>e.id!==entry.id);
    save(); closeModal(); render();
    showToast('Single instance removed');
  };
  document.getElementById('delForward').onclick = ()=>{
    if(!state.entryStops) state.entryStops = [];
    state.entryStops.push({ mealId: entry.mealId, date: entry.date });
    
    const targetDateObj = new Date(entry.date+'T00:00:00');
    const dayOfWeek = targetDateObj.getDay();
    state.entries = state.entries.filter(e => {
      const eDateObj = new Date(e.date+'T00:00:00');
      const isSameMeal = e.mealId === entry.mealId;
      const isSameDayOfWeek = eDateObj.getDay() === dayOfWeek;
      const isFutureOrToday = eDateObj >= targetDateObj;
      if(isSameMeal && isSameDayOfWeek && isFutureOrToday) return false;
      return true;
    });
    save(); closeModal(); render();
    showToast('Recurring series stopped from this date forward');
  };
}

/* ============================= PLAN MODAL ============================= */
function openPlanModal({mealId=null, defaultDate=null}={}){
  if(state.meals.length===0){
    openModal(`<h2>No meals yet</h2><p>Add a meal in the Menu tab first, then come back to plan it on the calendar.</p>
      <button class="btn btn-primary btn-block" id="closeM">Got it</button>`);
    document.getElementById('closeM').onclick = closeModal;
    return;
  }
  const d0 = defaultDate || state.selectedDate;
  let selMeal = mealId || state.meals[0].id;
  let selType = 'dinner';
  let mealServings = state.householdSize;
  let isRecurring = false;
  const weekStart = startOfWeek(d0);
  const weekDates = Array.from({length:7},(_,i)=>iso(addDays(weekStart,i)));
  let chosen = new Set([d0]);
  let extra = [];

  function updateMealServingsDefault(){
    const m = state.meals.find(x=>x.id===selMeal);
    if(m) mealServings = state.householdSize;
  }
  updateMealServingsDefault();

  function bodyHtml(){
    const fixedMealName = mealId ? (state.meals.find(m=>m.id===mealId)||{}).name : null;
    return `
      <h2>Plan a meal</h2>
      ${fixedMealName ? `<div class="card" style="padding:8px 12px; margin-bottom:8px;"><strong>${fixedMealName}</strong></div>` :
        `<label class="field-label">Meal</label>
         <select id="planMealSelect">${state.meals.map(m=>`<option value="${m.id}" ${m.id===selMeal?'selected':''}>${m.name}</option>`).join('')}</select>`}
      <label class="field-label">Meal type</label>
      <div id="typeToggle" style="display:flex; gap:6px; flex-wrap:wrap;">
        ${TYPE_ORDER.map(t=>`<button type="button" class="chip ${t===selType?'active':''}" data-type="${t}">${TYPE_LABELS[t]} ${TYPE_NAMES[t]}</button>`).join('')}
      </div>
      <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
        <div style="flex:1;">
          <label class="field-label" style="margin:0 0 4px;">Servings for this meal</label>
          <input type="number" id="planServingsInput" value="${mealServings}" min="1" max="100">
        </div>
      </div>
      <div style="margin:12px 0; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="planRecurringCb" ${isRecurring?'checked':''} style="width:18px;height:18px;accent-color:var(--gold);">
        <label for="planRecurringCb" style="font-size:13px;font-weight:600;cursor:pointer;margin:0;">Make this a recurring weekly meal (e.g. Taco Tuesday)</label>
      </div>
      <label class="field-label">Days this week</label>
      <div id="dayToggle" style="display:flex; gap:6px; flex-wrap:wrap;">
        ${weekDates.map(d=>{
          const dt=new Date(d+'T00:00:00');
          return `<button type="button" class="chip ${chosen.has(d)?'active':''}" data-date="${d}">${dt.toLocaleDateString(undefined,{weekday:'short'})} ${dt.getDate()}</button>`;
        }).join('')}
      </div>
      <label class="field-label">Add another date (different week)</label>
      <div style="display:flex; gap:6px;">
        <input type="date" id="extraDateInput" style="flex:1;">
        <button class="btn btn-ghost btn-sm" id="addExtraDate">Add</button>
      </div>
      ${extra.length? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
        ${extra.map(d=>`<span class="chip active" data-extra="${d}">${d} &times;</span>`).join('')}
      </div>`:''}
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="btn btn-ghost btn-block" id="cancelPlan">Cancel</button>
        <button class="btn btn-primary btn-block" id="confirmPlan">Add to calendar</button>
      </div>
    `;
  }

  function refresh(){
    document.querySelector('.modal').innerHTML = bodyHtml();
    wire();
  }

  function wire(){
    document.getElementById('cancelPlan').onclick = closeModal;
    const mealSel = document.getElementById('planMealSelect');
    if(mealSel) mealSel.onchange = ()=>{ selMeal = mealSel.value; updateMealServingsDefault(); refresh(); };
    const servIn = document.getElementById('planServingsInput');
    if(servIn) servIn.onchange = ()=>{ mealServings = parseInt(servIn.value, 10) || state.householdSize; };
    const recCb = document.getElementById('planRecurringCb');
    if(recCb) recCb.onchange = ()=>{ isRecurring = recCb.checked; };
    document.querySelectorAll('#typeToggle .chip').forEach(b=>{
      b.onclick = ()=>{ selType = b.dataset.type; refresh(); };
    });
    document.querySelectorAll('#dayToggle .chip').forEach(b=>{
      b.onclick = ()=>{
        const d = b.dataset.date;
        if(chosen.has(d)) chosen.delete(d); else chosen.add(d);
        refresh();
      };
    });
    document.getElementById('addExtraDate').onclick = ()=>{
      const val = document.getElementById('extraDateInput').value;
      if(!val) return;
      if(!weekDates.includes(val) && !extra.includes(val)) extra.push(val);
      chosen.add(val);
      refresh();
    };
    document.querySelectorAll('[data-extra]').forEach(chip=>{
      chip.onclick = ()=>{
        const d = chip.dataset.extra;
        extra = extra.filter(x=>x!==d);
        chosen.delete(d);
        refresh();
      };
    });
    document.getElementById('confirmPlan').onclick = ()=>{
      if(chosen.size===0){ alert('Pick at least one day.'); return; }
      chosen.forEach(d=>{
        state.entries.push({id:uid(), date:d, mealId:selMeal, mealType:selType, servings:mealServings, checked:[], recurring:isRecurring});
      });
      if(isRecurring) checkRecurringEntries();
      save(); closeModal();
      state.activeTab='calendar'; state.selectedDate=[...chosen][0]; save();
      render();
      showToast(`Planned for ${chosen.size} day${chosen.size===1?'':'s'}`);
    };
  }

  openModal(bodyHtml());
  wire();
}

/* ============================= MENU TAB ============================= */

function updateMealListContainer(container){
  container.innerHTML = '';
  const q = state.menuSearchQuery.trim();
  const filtered = state.meals.filter(m=>{
    const matchType = (state.menuFilterType==='all' || m.type===state.menuFilterType);
    if(!matchType) return false;
    if(!q) return true;
    const matchName = m.name.toLowerCase().includes(q);
    const matchIng = m.ingredients.some(i=>i.name.toLowerCase().includes(q));
    return matchName || matchIng;
  });

  if(filtered.length===0){
    container.innerHTML = `<div class="empty">No matching recipes found.</div>`;
    return;
  }

  filtered.forEach(meal=>{
    const card = document.createElement('div');
    card.className='card meal-card';
    const scaledCost = getScaledMealCost(meal);
    const costPerPerson = scaledCost / state.householdSize;

    card.innerHTML = `
      <div class="row-between">
        <div style="display:flex; align-items:center; gap:6px;">
          <span class="type-badge" style="background:${TYPE_COLORS[meal.type||'dinner']}; width:16px;height:16px;font-size:9px;">${TYPE_LABELS[meal.type||'dinner']}</span>
          <h3>${meal.name}</h3>
        </div>
        <div style="display:flex; gap:4px;">
          <button class="iconbtn" title="Duplicate meal" data-duplicate-meal="${meal.id}">${ICONS.copy}</button>
          <button class="iconbtn" title="Edit meal" data-edit="${meal.id}">&#9998;</button>
        </div>
      </div>
      <div class="costline">$${scaledCost.toFixed(2)} for ${state.householdSize} people &middot; $${costPerPerson.toFixed(2)}/person</div>
      <div style="margin-top:6px;">${meal.ingredients.map(i=>`<span class="tag">${i.name}</span>`).join('')}</div>
      ${meal.instructionsUrl?`<div style="margin-top:6px;"><a class="link" href="${meal.instructionsUrl}" target="_blank" rel="noopener">Instructions &rarr;</a></div>`:''}
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn btn-teal btn-sm" data-plan="${meal.id}">+ Plan on calendar</button>
        <button class="btn btn-danger btn-sm" data-del="${meal.id}">Delete</button>
      </div>
    `;
    container.appendChild(card);
    card.querySelector('[data-edit]').onclick = ()=>openMealForm(meal.id);
    card.querySelector('[data-duplicate-meal]').onclick = ()=>{
      const dup = JSON.parse(JSON.stringify(meal));
      dup.id = uid();
      dup.name = meal.name + ' (Copy)';
      dup.ingredients.forEach(i => i.id = uid());
      state.meals.push(dup);
      save(); render();
      showToast('Meal duplicated to recipe box');
    };
    card.querySelector('[data-del]').onclick = ()=>{
      if(confirm(`Remove "${meal.name}" from the recipe box?`)){
        state.meals = state.meals.filter(m=>m.id!==meal.id);
        save(); render();
      }
    };
    card.querySelector('[data-plan]').onclick = ()=>openPlanModal({mealId:meal.id, defaultDate:state.selectedDate});
  });
}

function openMealForm(mealId){
  const editing = !!mealId;
  const meal = editing ? state.meals.find(m=>m.id===mealId) : {
    id:uid(), type:'dinner', name:'', servings:4, costTotal:0, instructionsUrl:'', ingredients:[]
  };
  let draftIngredients = meal.ingredients.map(i=>({...i}));

  function ingredientRowHtml(ing){
    return `
      <div class="ing-edit-row" data-row="${ing.id}">
        <input type="text" placeholder="ingredient name" value="${ing.name}" data-ing-name="${ing.id}">
        <div class="ing-edit-subrow">
          <input type="number" step="0.25" min="0" value="${ing.qty}" data-ing-qty="${ing.id}">
          <select data-ing-unit="${ing.id}">
            ${UNIT_LIST.map(u=>`<option value="${u}" ${u===ing.unit?'selected':''}>${u}</option>`).join('')}
          </select>
          <input type="number" class="cost-input" step="0.01" min="0" placeholder="$" value="${ing.cost||''}" data-ing-cost="${ing.id}">
          <button class="iconbtn" data-ing-remove="${ing.id}">${ICONS.x}</button>
        </div>
      </div>`;
  }

  function bodyHtml(){
    return `
      <h2>${editing?'Edit meal':'New meal'}</h2>
      <label class="field-label">Meal name</label>
      <input type="text" id="mName" value="${meal.name}" placeholder="e.g. Pasta Bake">
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label class="field-label">Category</label>
          <select id="mType">
            <option value="breakfast" ${meal.type==='breakfast'?'selected':''}>Breakfast</option>
            <option value="lunch" ${meal.type==='lunch'?'selected':''}>Lunch</option>
            <option value="dinner" ${meal.type==='dinner'?'selected':''}>Dinner</option>
            <option value="snack" ${meal.type==='snack'?'selected':''}>Snack</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="field-label">Base Servings</label>
          <input type="number" id="mServings" value="${meal.servings||4}" min="1">
        </div>
      </div>
      <label class="field-label">Total Cost ($)</label>
      <input type="number" id="mCost" value="${meal.costTotal||''}" step="0.01" min="0">
      <label class="field-label">Instructions link</label>
      <input type="url" id="mLink" value="${meal.instructionsUrl}" placeholder="https://...">
      <label class="field-label">Ingredients <span style="font-weight:400; text-transform:none;">(name, qty, unit, cost)</span></label>
      <div id="ingRows">${draftIngredients.map(ingredientRowHtml).join('')}</div>
      <button class="btn btn-ghost btn-sm" id="addIngRow" style="margin-top:4px;">${ICONS.plus} Add ingredient</button>
      <div style="display:flex; gap:8px; margin-top:18px;">
        <button class="btn btn-ghost btn-block" id="cancelMeal">Cancel</button>
        <button class="btn btn-primary btn-block" id="saveMeal">Save meal</button>
      </div>
    `;
  }

  openModal(bodyHtml());
  wireMealForm();

  function wireMealForm(){
    document.getElementById('cancelMeal').onclick = closeModal;
    document.getElementById('addIngRow').onclick = ()=>{
      const newIng = {id:uid(), name:'', qty:1, unit:'ea', cost:0};
      draftIngredients.push(newIng);
      document.getElementById('ingRows').insertAdjacentHTML('beforeend', ingredientRowHtml(newIng));
      wireIngRow(newIng.id);
    };
    draftIngredients.forEach(ing=>wireIngRow(ing.id));

    document.getElementById('saveMeal').onclick = ()=>{
      const name = document.getElementById('mName').value.trim();
      if(!name){ alert('Give the meal a name first.'); return; }
      meal.name = name;
      meal.type = document.getElementById('mType').value;
      meal.servings = parseFloat(document.getElementById('mServings').value) || 4;
      meal.costTotal = parseFloat(document.getElementById('mCost').value) || 0;
      meal.instructionsUrl = document.getElementById('mLink').value.trim();
      meal.ingredients = draftIngredients.filter(i=>i.name.trim()!=='');
      if(!editing) state.meals.push(meal);
      save(); closeModal(); render();
    };
  }
  function wireIngRow(id){
    const nameEl = document.querySelector(`[data-ing-name="${id}"]`);
    const qtyEl = document.querySelector(`[data-ing-qty="${id}"]`);
    const unitEl = document.querySelector(`[data-ing-unit="${id}"]`);
    const costEl = document.querySelector(`[data-ing-cost="${id}"]`);
    const rmEl = document.querySelector(`[data-ing-remove="${id}"]`);
    const target = ()=>draftIngredients.find(i=>i.id===id);
    nameEl.oninput = ()=>{ target().name = nameEl.value; };
    qtyEl.oninput = ()=>{ target().qty = parseFloat(qtyEl.value)||0; };
    unitEl.onchange = ()=>{ target().unit = unitEl.value; };
    costEl.oninput = ()=>{ target().cost = parseFloat(costEl.value)||0; };
    rmEl.onclick = ()=>{
      draftIngredients = draftIngredients.filter(i=>i.id!==id);
      document.querySelector(`[data-row="${id}"]`).remove();
    };
  }
}

/* ============================= SHOPPING LIST TAB ============================= */
function renderShoppingTab(view){
  const controls = document.getElementById('topControls');
  controls.innerHTML = `
    <button class="pill" id="clearPurchased">Clear purchased</button>
    <button class="pill" id="clearAll">Clear all</button>
  `;
  controls.querySelector('#clearPurchased').onclick = ()=>{
    state.shoppingList = state.shoppingList.filter(i=>!i.purchased);
    save(); render();
  };
  controls.querySelector('#clearAll').onclick = ()=>{
    if(confirm('Clear the entire shopping list?')){ state.shoppingList=[]; save(); render(); }
  };

  const addRow = document.createElement('div');
  addRow.className='card';
  addRow.innerHTML = `
    <label class="field-label">Add item manually</label>
    <input type="text" id="manName" placeholder="item name">
    <div class="ing-edit-subrow">
      <input type="number" id="manQty" step="0.25" value="1">
      <select id="manUnit">${UNIT_LIST.map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
      <input type="number" class="cost-input" id="manCost" step="0.01" min="0" placeholder="$">
      <button class="iconbtn" id="manAdd">${ICONS.plus}</button>
    </div>
  `;
  view.appendChild(addRow);
  addRow.querySelector('#manAdd').onclick = ()=>{
    const name = document.getElementById('manName').value.trim();
    const qty = parseFloat(document.getElementById('manQty').value)||0;
    const unit = document.getElementById('manUnit').value;
    const cost = parseFloat(document.getElementById('manCost').value)||0;
    if(!name || qty<=0) return;
    addIngredientsToShoppingList([{name, qty, unit, cost}]);
    showToast(`Added ${name} to shopping list`);
    render();
  };

  const receipt = document.createElement('div');
  receipt.className='receipt';
  const items = state.shoppingList.slice().sort((a,b)=> (a.purchased-b.purchased) || a.name.localeCompare(b.name));
  const estTotal = items.filter(i=>!i.purchased).reduce((s,i)=>s+(i.costEstimate||0),0);
  receipt.innerHTML = `
    <div class="receipt-head">
      <div class="store">HEARTH GROCERY</div>
      <div class="meta">${items.length} item${items.length===1?'':'s'} &middot; Household: ${state.householdSize}</div>
    </div>
    <hr>
    ${items.length===0 ? `<div class="empty" style="font-family:var(--body);">List is empty. Uncheck ingredients on a planned meal, or add items above.</div>` :
      items.map(it=>{
        const disp = displayFromBase(it.category, it.base);
        return `<div class="receipt-line ${it.purchased?'purchased':''}" data-item="${it.id}">
          <input type="checkbox" data-buy="${it.id}" ${it.purchased?'checked':''}>
          <span class="name">${it.name}</span>
          <button class="step-btn" data-step="-1" data-item="${it.id}">&minus;</button>
          <span class="qty">${disp.qty} ${disp.unit}</span>
          <button class="step-btn" data-step="1" data-item="${it.id}">+</button>
          ${it.costEstimate?`<span class="est">$${it.costEstimate.toFixed(2)}</span>`:''}
          <button class="iconbtn" style="padding:2px 4px; font-size:15px;" data-edit-item="${it.id}">&#9998;</button>
          <button class="iconbtn" style="padding:2px 4px;" data-del-item="${it.id}">${ICONS.x}</button>
        </div>`;
      }).join('<hr style="margin:3px 0; opacity:.5;">')
    }
    <hr>
    <div class="receipt-total"><span>ITEMS TO BUY</span><span>${items.filter(i=>!i.purchased).length}</span></div>
    <div class="receipt-total est"><span>EST. COST REMAINING</span><span>$${estTotal.toFixed(2)}</span></div>
  `;
  view.appendChild(receipt);

  receipt.querySelectorAll('[data-buy]').forEach(cb=>{
    cb.onchange = ()=>{
      const item = state.shoppingList.find(i=>i.id===cb.dataset.buy);
      item.purchased = cb.checked;
      save(); render();
    };
  });
  receipt.querySelectorAll('[data-step]').forEach(b=>{
    b.onclick = ()=>{
      const item = state.shoppingList.find(i=>i.id===b.dataset.item);
      const disp = displayFromBase(item.category, item.base);
      const stepBase = UNITS[disp.unit].toBase;
      const delta = parseInt(b.dataset.step,10)*stepBase;
      item.base = Math.max(0, item.base + delta);
      save(); render();
    };
  });
  receipt.querySelectorAll('[data-edit-item]').forEach(b=>{
    b.onclick = ()=>openShoppingItemEdit(b.dataset.editItem);
  });
  receipt.querySelectorAll('[data-del-item]').forEach(b=>{
    b.onclick = ()=>{
      state.shoppingList = state.shoppingList.filter(i=>i.id!==b.dataset.delItem);
      save(); render();
    };
  });
}

function openShoppingItemEdit(itemId){
  const item = state.shoppingList.find(i=>i.id===itemId);
  if(!item) return;
  const disp = displayFromBase(item.category, item.base);
  const catUnits = UNIT_LIST.filter(u=>UNITS[u].cat===item.category);
  openModal(`
    <h2>Edit item</h2>
    <label class="field-label">Name</label>
    <input type="text" id="eName" value="${item.name}">
    <div style="display:flex; gap:10px;">
      <div style="flex:1;"><label class="field-label">Qty</label><input type="number" id="eQty" step="0.25" value="${disp.qty}"></div>
      <div style="flex:1;"><label class="field-label">Unit</label><select id="eUnit">${catUnits.map(u=>`<option value="${u}" ${u===disp.unit?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <label class="field-label">Estimated cost ($)</label>
    <input type="number" id="eCost" step="0.01" min="0" value="${item.costEstimate||0}">
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="btn btn-danger btn-block" id="deleteItem">Delete</button>
      <button class="btn btn-primary btn-block" id="saveItem">Save</button>
    </div>
  `);
  document.getElementById('deleteItem').onclick = ()=>{
    state.shoppingList = state.shoppingList.filter(i=>i.id!==itemId);
    save(); closeModal(); render();
  };
  document.getElementById('saveItem').onclick = ()=>{
    const name = document.getElementById('eName').value.trim();
    const qty = parseFloat(document.getElementById('eQty').value)||0;
    const unit = document.getElementById('eUnit').value;
    const cost = parseFloat(document.getElementById('eCost').value)||0;
    if(!name) return;
    item.name = name; item.key = name.toLowerCase();
    item.base = qty * UNITS[unit].toBase;
    item.costEstimate = cost;
    save(); closeModal(); render();
    showToast('Item updated');
  };
}

  if(state.pantry.length===0){
    listCard.innerHTML += `<div class="empty">Pantry is empty. Add what you've got on hand.</div>`;
  } else {
    state.pantry.forEach(p=>{
      const row = document.createElement('div');
      row.className='ing-row';
      row.innerHTML = `
        <span>${p.name}</span>
        <span class="ing-qty">${fmtQtyUnit(p.qty,p.unit)}</span>
        <button class="iconbtn" title="Edit item" data-edit-pantry="${p.id}">&#9998;</button>
        <button class="iconbtn" title="Delete item" data-rm="${p.id}">${ICONS.x}</button>
      `;
      row.querySelector('[data-edit-pantry]').onclick = ()=>openPantryForm(p.id);

        save(); render();
      };

    });
  }
  view.appendChild(listCard);

  const matchCard = document.createElement('div');
  matchCard.className='card';
  matchCard.innerHTML = `<h2 class="section-title">Best matches from what's on hand</h2>`;
  const ranked = state.meals.map(m=>({meal:m, pct:mealMatchPct(m)})).sort((a,b)=>b.pct-a.pct);
  if(ranked.length===0){
    matchCard.innerHTML += `<div class="empty">Add meals in the Menu tab to see matches.</div>`;
  } else {
    ranked.forEach(({meal,pct})=>{
      const el = document.createElement('div');
      el.style.marginBottom='12px';
      el.innerHTML = `
        <div class="row-between"><strong style="font-size:14px;">${meal.name}</strong><span class="tag">${pct}% on hand</span></div>
        <div class="match-bar-track"><div class="match-bar-fill" style="width:${pct}%; background:${pct>=75?'var(--accent)':pct>=40?'var(--gold)':'var(--primary)'}"></div></div>
      `;
      matchCard.appendChild(el);
    });
  }
  view.appendChild(matchCard);
}

function openPantryForm(pantryId){
  const editing = !!pantryId;
  const item = editing ? state.pantry.find(p=>p.id===pantryId) : { id:uid(), name:'', qty:1, unit:'ea' };

  openModal(`
    <h2>${editing ? 'Edit pantry item' : 'Add pantry item'}</h2>
    <label class="field-label">Item name</label>
    <input type="text" id="pName" placeholder="e.g. olive oil" value="${item.name}">
    <div style="display:flex; gap:10px;">
      <div style="flex:1;"><label class="field-label">Qty</label><input type="number" id="pQty" step="0.25" value="${item.qty}"></div>
      <div style="flex:1;"><label class="field-label">Unit</label><select id="pUnit">${UNIT_LIST.map(u=>`<option value="${u}" ${u===item.unit?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      ${editing ? '<button class="btn btn-danger btn-block" id="deletePantry">Delete</button>' : ''}
      <button class="btn btn-primary btn-block" id="savePantry">${editing ? 'Save' : 'Add'}</button>
    </div>
  `);

  if(editing){
    document.getElementById('deletePantry').onclick = ()=>{
      state.pantry = state.pantry.filter(p=>p.id!==pantryId);
      save(); closeModal(); render();
      showToast('Item removed from pantry');
    };
  }

  document.getElementById('savePantry').onclick = ()=>{
    const name = document.getElementById('pName').value.trim();
    const qty = parseFloat(document.getElementById('pQty').value)||0;
    const unit = document.getElementById('pUnit').value;
    if(!name) return;
    
    if(editing){
      item.name = name;
      item.key = name.toLowerCase();
      item.qty = qty;
      item.unit = unit;
    } else {
      state.pantry.push({ id:uid(), key:name.toLowerCase(), name, qty, unit });
    }
    save(); closeModal(); render();
    showToast(editing ? 'Pantry item updated' : 'Added to pantry');
  };
}

/* ============================= BUDGET TAB ============================= */
function renderBudgetTab(view){
  const controls = document.getElementById('topControls');
  controls.innerHTML = `
    <div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.15); padding:4px 10px; border-radius:999px; border:1px solid rgba(255,249,245,.3);">
      <span style="font-size:12px; font-weight:600; color:#FFF9F5;">Servings:</span>
      <input type="number" id="globalServingsInput" value="${state.householdSize}" min="1" max="100" style="width:44px; padding:2px 4px; font-size:13px; font-weight:700; text-align:center; border-radius:6px; border:none; background:#fff; color:var(--ink);">
    </div>
    <button class="pill ${state.calendarView==='week'?'active':''}" id="bWeek">This week</button>
    <button class="pill ${state.calendarView==='month'?'active':''}" id="bMonth">This month</button>
  `;
  controls.querySelector('#globalServingsInput').onchange = (e)=>{
    const val = parseInt(e.target.value, 10);
    if(val > 0){ state.householdSize = val; save(); render(); }
  };
  controls.querySelector('#bWeek').onclick=()=>{state.calendarView='week'; save(); render();};
  controls.querySelector('#bMonth').onclick=()=>{state.calendarView='month'; save(); render();};

  let rangeEntries, rangeLabel;
  if(state.calendarView==='week'){
    const start = startOfWeek(state.anchorDate);
    const end = addDays(start,6);
    rangeEntries = state.entries.filter(e=> e.date>=iso(start) && e.date<=iso(end));
    rangeLabel = `${niceDate(start)} – ${niceDate(end)}`;
  } else {
    const anchor = new Date(state.anchorDate+'T00:00:00');
    const ym = `${anchor.getFullYear()}-${String(anchor.getMonth()+1).padStart(2,'0')}`;
    rangeEntries = state.entries.filter(e=> e.date.startsWith(ym));
    rangeLabel = anchor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  }

  const total = rangeEntries.reduce((sum,e)=>{
    const meal = state.meals.find(m=>m.id===e.mealId);
    return sum + (meal ? getScaledMealCostForEntry(meal, e) : 0);
  },0);
  const pct = state.budgetTarget>0 ? Math.min(100, Math.round((total/state.budgetTarget)*100)) : 0;
  const over = total > state.budgetTarget;

  const targetCard = document.createElement('div');
  targetCard.className='card';
  targetCard.innerHTML = `
    <div class="budget-header">
      <span>${rangeLabel}</span>
      <span>Target: <input type="number" id="targetInput" value="${state.budgetTarget}" style="width:70px; display:inline-block; padding:3px 6px;"></span>
    </div>
    <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${pct}%; background:${over?'var(--primary)':'var(--accent)'}"></div></div>
    <div class="row-between" style="margin-top:6px;">
      <span class="budget-target-num" style="color:${over?'var(--primary-dark)':'var(--accent-dark)'}">$${total.toFixed(2)} planned</span>
      <span style="font-size:12.5px; color:var(--ink-soft);">of $${state.budgetTarget.toFixed(2)}</span>
    </div>
  `;
  view.appendChild(targetCard);
  targetCard.querySelector('#targetInput').onchange = (e)=>{
    state.budgetTarget = parseFloat(e.target.value)||0; save(); render();
  };

  const planCard = document.createElement('div');
  planCard.className='card';
  planCard.innerHTML = `<h2 class="section-title">Meals in this range</h2>`;
  if(rangeEntries.length===0){
    planCard.innerHTML += `<div class="empty">Nothing planned yet — add meals from the Menu tab.</div>`;
  } else {
    rangeEntries.slice().sort((a,b)=> a.date.localeCompare(b.date) || byType(a,b)).forEach(e=>{
      const meal = state.meals.find(m=>m.id===e.mealId);
      if(!meal) return;
      const scaledCost = getScaledMealCostForEntry(meal, e);
      const row = document.createElement('div');
      row.className='ing-row';
      row.innerHTML = `<span class="type-badge" style="background:${TYPE_COLORS[e.mealType]}">${TYPE_LABELS[e.mealType]}</span>
        <span>${meal.name} (${getEntryServings(e)}p) ${e.recurring?'&#8635;':''} <span class="tag">${e.date}</span></span>
        <span class="ing-qty">$${scaledCost.toFixed(2)}</span>
        <button class="iconbtn" data-rm="${e.id}">${ICONS.x}</button>`;
      row.querySelector('[data-rm]').onclick=()=>{
        if(e.recurring){
          openStopRecurringModal(e);
          return;
        }
        state.entries = state.entries.filter(x=>x.id!==e.id);
        save(); render();
      };
      planCard.appendChild(row);
    });
  }
  view.appendChild(planCard);

  const libCard = document.createElement('div');
  libCard.className='card';
  libCard.innerHTML = `<h2 class="section-title">Recipe box, sorted by cost</h2>`;
  const sorted = state.meals.slice().sort((a,b)=>getScaledMealCost(a)-getScaledMealCost(b));
  if(sorted.length===0){
    libCard.innerHTML += `<div class="empty">No meals yet.</div>`;
  }
  sorted.forEach(meal=>{
    const scaledCost = getScaledMealCost(meal);
    const row = document.createElement('div');
    row.className='ing-row';
    row.innerHTML = `<span>${meal.name}</span><span class="ing-qty">$${scaledCost.toFixed(2)}</span>
      <button class="btn btn-teal btn-sm" style="margin-left:8px;" data-add="${meal.id}">+ Add</button>`;
    row.querySelector('[data-add]').onclick = ()=>{
      const d = state.calendarView==='week' ? iso(startOfWeek(state.anchorDate)) : state.anchorDate;
      openPlanModal({mealId:meal.id, defaultDate:d});
    };
    libCard.appendChild(row);
  });
  view.appendChild(libCard);
}

/* ============================= MODAL ============================= */
function openModal(innerHtml){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="backdrop"><div class="modal">${innerHtml}</div></div>`;
  document.getElementById('backdrop').onclick = (e)=>{ if(e.target.id==='backdrop') closeModal(); };
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
